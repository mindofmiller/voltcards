  return `<div class="pchint" style="margin-bottom:8px">One row per sync (every 3 hours). "Searched" is how many favorites got an eBay search; the budget logic rotates through them if eBay's daily quota gets tight.</div><div style="overflow:auto"><table class="ptbl" style="width:100%;table-layout:auto"><thead><tr><th style="text-align:left">When</th><th>Favorites</th><th>Searched</th><th>Listings found</th><th>New</th><th>eBay quota left</th><th style="text-align:left">Status</th></tr></thead><tbody>`
    +AUD.runs.map(r=>`<tr><td style="text-align:left;white-space:nowrap">${escH(timeAgo(r.ran_at))}<div class="muted" style="font-size:10px">${escH(new Date(r.ran_at).toLocaleString())}</div></td><td>${r.favorites??"—"}</td><td>${r.searched??"—"}</td><td>${r.listings??"—"}</td><td>${r.new_listings??"—"}</td><td>${r.quota_remaining??"—"}</td><td style="text-align:left;white-space:normal">${r.skipped?`<span class="neg">skipped: ${escH(r.skipped)}</span>`:r.error?`<span class="neg">${escH(r.error)}</span>`:'<span class="pos">ok</span>'}</td></tr>`).join("")
    +`</tbody></table></div>`;
}
function audWire(w){
  w.querySelectorAll(".audHead").forEach(h=>h.onclick=()=>{ const k=h.parentElement.dataset.k; if(AUD.open.has(k)) AUD.open.delete(k); else AUD.open.add(k); audRender(); });
  w.querySelectorAll(".audAck").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const r=AUD.rows.find(x=>audKey(x)===b.dataset.k); if(r){ AUD.ack[b.dataset.k]=audSig(r); audSaveAck(); audRender(); } });
  const q=w.querySelector("#audQ"); if(q) q.oninput=()=>{ AUD.q=q.value; const pos=q.selectionStart; audRender(); const n=document.getElementById("audQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  const g=w.querySelector("#audGame"); if(g) g.onchange=()=>{ AUD.game=g.value; audRender(); };
  const csv=w.querySelector("#audCsv"); if(csv) csv.onclick=audTermsCsv;
  const gr=w.querySelector("#audGrade"); if(gr) gr.onchange=()=>{ AUD.grade=gr.value; audRender(); };
  const lt=w.querySelector("#audLate"); if(lt) lt.onchange=()=>{ AUD.lateOnly=lt.checked; audRender(); };
}
function renderLetsBuy(){
  const body=document.getElementById("bbody");
  pcolStyle();
  const now=Date.now(), H=3600*1000;
  const gm={};
  const srcItems=LBL.noAuc?LB.filter(it=>!lbIsAuction(it)):LB;   // optionally drop auction listings
  srcItems.forEach(it=>{ const k=[it.game,it.set_name,it.card_number,it.parallel].join("¦");
    (gm[k]||(gm[k]={rep:it,items:[]})).items.push(it); });
  let groups=Object.values(gm);
  groups.forEach(g=>{
    g.c1=g.c6=g.c12=g.c24=0;
    g.items.forEach(it=>{ const age=now-new Date(it.first_seen).getTime();
      if(age<=H)g.c1++; if(age<=6*H)g.c6++; if(age<=12*H)g.c12++; if(age<=24*H)g.c24++; });
    g.total=g.items.length;
    g.minPrice=Math.min.apply(null,g.items.map(it=>num(it.price)));
    g.paidAvg=num(g.rep.paid_avg); g.raw=num(g.rep.raw);
    g.items.sort((a,b)=>new Date(b.first_seen).getTime()-new Date(a.first_seen).getTime());   // newest first, so the arrivals driving the ≤1h/≤6h counts sit at the top
    g.hasDeal=g.items.some(it=>isBinDeal(it,g));
    let bp=Math.max.apply(null,g.items.map(it=>{const p=lbEstProfit(it);return p==null?-1e9:p;}));
    g.bestProfit=bp<=-1e9?null:bp;
  });
  if(LBL.sort && LBSORT[LBL.sort.key]){ const acc=LBSORT[LBL.sort.key], dir=LBL.sort.dir;
    groups.sort((a,b)=>{ let av=acc(a),bv=acc(b); av=(av==null)?-Infinity:av; bv=(bv==null)?-Infinity:bv; if(av<bv)return -dir; if(av>bv)return dir; return 0; }); }
  else groups.sort((a,b)=> (b.hasDeal?1:0)-(a.hasDeal?1:0) || b.c1-a.c1 || b.c6-a.c6 || b.total-a.total);
  if(LBQ){ const q=LBQ.toLowerCase(); groups=groups.filter(g=>((g.rep.name||g.rep.title||"")+" "+(g.rep.set_name||"")+" "+(g.rep.card_number||"")+" "+(g.rep.parallel||"")).toLowerCase().includes(q)); }
  LBGROUPS=groups;
  // Favorites that match the search but have no live listing right now — surface them so a
  // favorite is never "unfindable" just because nothing's for sale at the moment.
  let favHtml="";
  if(LBQ){
    lbLoadFavs();
    const q=LBQ.toLowerCase();
    const liveKeys=new Set(groups.map(g=>[g.rep.game,g.rep.set_name,g.rep.card_number,g.rep.parallel].join("¦")));
    const fm=(LBFAV||[]).filter(f=>{ const k=[f.game,f.set_name,f.card_number,f.parallel].join("¦"); if(liveKeys.has(k))return false; return ((f.name||"")+" "+(f.set_name||"")+" "+(f.card_number||"")+" "+(f.parallel||"")).toLowerCase().includes(q); });
    if(fm.length){
      window.__LBFM=fm;
      favHtml='<div class="note" style="margin:10px 0 0;background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px"><b>⭐ Favorites matching “'+escH(LBQ)+'” with no live listing right now:</b><div style="margin-top:6px;display:flex;flex-direction:column;gap:6px">'
        +fm.slice(0,25).map((f,i)=>`<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;font-size:13px">${escH(f.name||"")} <span class="muted">${escH(f.set_name||"")} · #${escH(f.card_number||"")}${f.parallel&&f.parallel!=="Base"?" · "+escH(f.parallel):""}</span></span><button class="pbtn lbfav" data-i="${i}" style="white-space:nowrap">View card</button></div>`).join("")
        +'</div><div class="muted" style="font-size:11px;margin-top:6px">The Let\'s Buy table only lists favorites with an active raw eBay listing. These are favorites with no listing at the moment — tap to see prices/comps.</div></div>';
    }
  }
  const wireLbFav=()=>{ body.querySelectorAll(".lbfav").forEach(b=>b.onclick=()=>lbOpenFav(window.__LBFM[+b.dataset.i])); };
  if(!groups.length){
    let msg = LBQ ? (favHtml||'<p class="note">No favorites match “'+escH(LBQ)+'”. <a href="#" id="lbClrSearch">Clear search</a></p>')
                  : '<p class="note">No active raw listings right now. The background refresh runs every 30 min — check back soon, or add more favorites (☆ on any card).</p>';
    if(LBQ) msg='<div class="fbar"><div class="fsearch"><input id="lbSearch" class="srchbox" placeholder="🔍 Search card / set / #" value="'+escH(LBQ)+'"></div></div>'+msg+'<p class="note" style="margin-top:8px"><a href="#" id="lbClrSearch">Clear search</a></p>';
    body.innerHTML=msg;
    const c=body.querySelector("#lbClrSearch"); if(c) c.onclick=(e)=>{e.preventDefault(); LBQ=""; renderLetsBuy();};
    const lbs2=body.querySelector("#lbSearch"); if(lbs2) lbs2.oninput=()=>{ LBQ=lbs2.value; renderLetsBuy(); const el=document.getElementById("lbSearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } };
    wireLbFav();
    return;
  }
  const cols=LBL.order.map(k=>LBCOLS.find(c=>c[0]===k)).filter(c=>c && !LBL.hidden[c[0]]);
  const menu=LBL.order.map(k=>{const c=LBCOLS.find(x=>x[0]===k);return `<label class="pcitem"><input type="checkbox" data-col="${k}" ${LBL.hidden[k]?"":"checked"}> ${c[1]}</label>`;}).join("");
  let h=`<div class="note" style="margin:0 0 8px;max-width:600px">Raw listings for your ⭐ favorites (Buy It Now + auctions), refreshed every 30 min. <b>🔥</b> = a Buy It Now ≥${FIRECFG.pct}% below your avg paid/market raw, listed &lt;${FIRECFG.hours}h ago (adjust with 🔥 Rules). <b>B</b>=Buy It Now, <b>A</b>=Auction. Prices include shipping.</div>`;
  h+=`<div class="fbar"><div class="fsearch">`
    +`<input id="lbSearch" class="srchbox" placeholder="🔍 Search card / set / #" value="${escH(LBQ)}"></div><div class="frow">`
    +`<button class="pbtn fctl" id="lbRefresh" title="Re-check eBay now for sold/ignored items">🔄 Refresh</button>`
    +`<button class="pbtn fctl" id="lbNoAuc" title="Show Buy It Now only — hide auction listings" style="${LBL.noAuc?'background:#1a2233;color:#fff;border-color:#1a2233':''}">${LBL.noAuc?'🚫 Auctions hidden':'Hide auctions'}</button>`
    +`<div class="pcolwrap fctl"><button class="pbtn" id="fireBtn">🔥 Rules</button><div class="pcmenu" id="fireMenu" style="display:none;min-width:236px"><div class="pchint">🔥 flags a Buy It Now priced at least X% below your avg paid or the market raw, listed within the last N hours.</div><label class="pcitem" style="justify-content:space-between">Discount % below <input id="fPct" type="number" min="1" max="99" value="${FIRECFG.pct}" style="width:60px"></label><label class="pcitem" style="justify-content:space-between">Listed within (hrs) <input id="fHrs" type="number" min="1" max="336" value="${FIRECFG.hours}" style="width:60px"></label><label class="pcitem"><input type="checkbox" id="fPaid" ${FIRECFG.vsPaid?"checked":""}> vs your avg paid</label><label class="pcitem"><input type="checkbox" id="fRaw" ${FIRECFG.vsRaw?"checked":""}> vs market raw</label><button class="pbtn" id="fireSave" style="margin-top:8px;width:100%">💾 Save &amp; refresh</button></div></div>`
    +`<div class="pcolwrap fctl"><button class="pbtn" id="alertBtn">🔔 Alerts</button><div class="pcmenu" id="alertMenu" style="display:none;min-width:252px"></div></div>`
    +`<div class="pcolwrap fctl"><button class="pbtn" id="blockBtn">🚫 Sellers</button><div class="pcmenu" id="blockMenu" style="display:none;min-width:250px"></div></div>`
    +`<div class="pcolwrap fctl"><button class="pbtn" id="lbcolBtn">⚙ Columns ▾</button><div class="pcmenu" id="lbcolMenu" style="display:none"><div class="pchint">Show / hide · drag headers to reorder</div>${menu}<button class="pbtn" id="lbcolReset" style="margin-top:6px;width:100%">Reset layout</button></div></div>`
    +`</div></div>`;
  h+='<div class="tablewrap"><table class="ptbl"><thead><tr><th class="pcx"></th>'+cols.map(c=>{
    const active=LBL.sort&&LBL.sort.key===c[0];
    const car=active?(LBL.sort.dir>0?'▲':'▼'):(LBSORT[c[0]]?'⇅':'');
    const st=(LBL.widths[c[0]]?`width:${LBL.widths[c[0]]}px;`:'')+(LBSORT[c[0]]?'cursor:pointer':'');
    return `<th draggable="true" data-key="${c[0]}"${st?` style="${st}"`:''}>${c[1]}${car?` <span style="opacity:.45;font-size:10px">${car}</span>`:''}</th>`;
  }).join("")+'</tr></thead><tbody>';
  groups.forEach((g,gi)=>{
    h+=`<tr class="lgrow" data-gi="${gi}" style="cursor:pointer"><td><span class="caret">▸</span></td>`+cols.map(c=>`<td>${c[2](g,gi)}</td>`).join("")+`</tr>`;
    g.items.forEach((it,ii)=>{
      h+=`<tr class="lirow" data-gi="${gi}" data-ii="${ii}" hidden style="background:#fafbff;cursor:pointer"><td></td>`+cols.map(c=>`<td>${c[3](it,g)}</td>`).join("")+`</tr>`;
    });
  });
  h+='</tbody></table></div>';
  body.innerHTML=h+(favHtml||"");
  wireLbFav();
  body.querySelectorAll(".lbwatch").forEach(b=>b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); dfWatch(b,b.dataset.id); });
  body.querySelectorAll(".lbzoom").forEach(b=>b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); openImgLightbox(b.dataset.img); });
  const table=body.querySelector("table.ptbl");
  makeResizable(table,(k,w)=>{ LBL.widths[k]=w; saveLBL(LBL); });
  let dragKey=null, dragged=false;
  table.querySelectorAll("thead th[data-key]").forEach(th=>{
    th.addEventListener("dragstart",e=>{ dragKey=th.dataset.key; dragged=true; e.dataTransfer.effectAllowed="move"; });
    th.addEventListener("dragover",e=>{ e.preventDefault(); th.style.boxShadow="inset 3px 0 0 #5566ff"; });
    th.addEventListener("dragleave",()=>{ th.style.boxShadow=""; });
    th.addEventListener("drop",e=>{ e.preventDefault(); th.style.boxShadow=""; const tgt=th.dataset.key; if(!dragKey||dragKey===tgt) return;
      const o=LBL.order.slice(); o.splice(o.indexOf(dragKey),1); o.splice(o.indexOf(tgt),0,dragKey); LBL.order=o; saveLBL(LBL); renderLetsBuy(); });
    th.addEventListener("click",e=>{ if(dragged){ dragged=false; return; } if(e.target.closest(".colresize")) return;
      const k=th.dataset.key; if(!LBSORT[k]) return;
      if(LBL.sort && LBL.sort.key===k) LBL.sort={key:k,dir:LBL.sort.dir*-1};
      else LBL.sort={key:k,dir:(k==='card'||k==='set'||k==='num')?1:-1};
      saveLBL(LBL); renderLetsBuy(); });
  });
  const naBtn=body.querySelector("#lbNoAuc");
  if(naBtn) naBtn.onclick=()=>{ LBL.noAuc=!LBL.noAuc; saveLBL(LBL); renderLetsBuy(); };
  const lbs=body.querySelector("#lbSearch");
  if(lbs) lbs.oninput=()=>{ LBQ=lbs.value; renderLetsBuy(); const el=document.getElementById("lbSearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } };
  const rbtn=body.querySelector("#lbRefresh");
  if(rbtn) rbtn.onclick=async()=>{
    if(!sb||!SESSION){ openLetsBuy(); return; }
    rbtn.disabled=true; rbtn.textContent="⏳ Checking eBay…";
    try{ await sb.functions.invoke("refresh-favorites"); }catch(e){ /* still re-query below */ }

  };
  const cbtn=body.querySelector("#lbcolBtn"), cmnu=body.querySelector("#lbcolMenu");
  if(cbtn) cbtn.onclick=()=>{ cmnu.style.display=cmnu.style.display==="none"?"block":"none"; };
  const firebtn=body.querySelector("#fireBtn"), firemnu=body.querySelector("#fireMenu");
  if(firebtn) firebtn.onclick=()=>{ firemnu.style.display=firemnu.style.display==="none"?"block":"none"; };
  const albtn=body.querySelector("#alertBtn"), almnu=body.querySelector("#alertMenu");
  if(albtn) albtn.onclick=()=>{ const show=almnu.style.display==="none"; if(show){ renderAlertMenu(almnu); floatMenuOpen(albtn,almnu); } else floatMenuClose(almnu); };
  const blkbtn=body.querySelector("#blockBtn"), blkmnu=body.querySelector("#blockMenu");
  if(blkbtn) blkbtn.onclick=()=>{ const show=blkmnu.style.display==="none"; blkmnu.style.display=show?"block":"none"; if(show) renderBlockMenu(blkmnu); };
  const firesave=body.querySelector("#fireSave");
  if(firesave) firesave.onclick=()=>{
    FIRECFG.pct=Math.max(1,Math.min(99,parseFloat(body.querySelector("#fPct").value)||20));
    FIRECFG.hours=Math.max(1,Math.min(336,parseFloat(body.querySelector("#fHrs").value)||6));
    FIRECFG.vsPaid=body.querySelector("#fPaid").checked;
    FIRECFG.vsRaw=body.querySelector("#fRaw").checked;
    if(!FIRECFG.vsPaid && !FIRECFG.vsRaw) FIRECFG.vsRaw=true;   // keep at least one basis
    saveFire();
    openLetsBuy();   // re-fetch latest listings + recompute fire flags
  };
  body.querySelectorAll("#lbcolMenu input[data-col]").forEach(cb=>cb.onchange=()=>{ LBL.hidden[cb.dataset.col]=!cb.checked; saveLBL(LBL); renderLetsBuy(); body.querySelector("#lbcolMenu").style.display="block"; });
  const rst=body.querySelector("#lbcolReset");
  if(rst) rst.onclick=()=>{ LBL={order:LBCOLS.map(c=>c[0]),hidden:{},widths:{},sort:null}; saveLBL(LBL); renderLetsBuy(); };
  const tb=body.querySelector("tbody");
  tb.addEventListener("click",e=>{
    if(e.target.closest("a")) return;
    const gb=e.target.closest(".gbtn"); if(gb){ e.stopPropagation(); openGallery(LBGROUPS[+gb.dataset.gal]); return; }
    const gr=e.target.closest("tr.lgrow");
    if(gr){ const kids=body.querySelectorAll(`tr.lirow[data-gi="${gr.dataset.gi}"]`);
      const show=kids.length&&kids[0].hidden; kids.forEach(x=>x.hidden=!show);
      const c=gr.querySelector(".caret"); if(c) c.textContent=show?"▾":"▸"; return; }
    const ir=e.target.closest("tr.lirow");
    if(ir){ openListing(LBGROUPS[+ir.dataset.gi].items[+ir.dataset.ii]); }
  });
}
function openListing(it){
  if(!it) return;
  const itEbay = it.pc_product==='eBay sold median';
  const pcRawL = itEbay? num(it.mkt_raw) : num(it.raw), pcP10L = itEbay? num(it.mkt_psa10) : num(it.psa10);
  const ebRawL = itEbay? num(it.raw) : null, ebP10L = itEbay? num(it.psa10) : null;
  const cardAttrL = `data-g="${escH(it.game||'')}" data-s="${escH(it.set_name||'')}" data-n="${escH(it.card_number||'')}" data-p="${escH(it.parallel||'')}" data-nm="${escH(it.name||'')}"`;
  const pillValL=(rw,pp,src)=> (rw==null&&pp==null)
    ? `<button class="pillget" data-src="${src}" ${cardAttrL} style="border:0;background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;opacity:.9">⟳ Get price</button>`
    : `<span style="font-weight:500;opacity:.85">Raw ${rw!=null?money2(rw):'—'} · PSA 10 ${pp!=null?money2(pp):'—'}</span>`;
  const srcPillL=(emoji,label,rw,pp,src,bg,bd,col)=>`<div class="srcpill" style="display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;background:${bg};border:1px solid ${bd};border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:${col}"><span>${emoji} ${label}</span><span class="pv-slot" style="margin-left:auto;text-align:right">${pillValL(rw,pp,src)}</span></div>`;
  document.getElementById("lTitle").textContent=it.name||it.title||"Listing";
  const prof=lbEstProfit(it), pct=it.seller_feedback_pct, sc=it.seller_feedback_score;
  const isBin=(it.buying_options||"").includes("FIXED_PRICE");
  const fresh6=!isNaN(new Date(it.first_seen).getTime()) && (Date.now()-new Date(it.first_seen).getTime())<=FIRECFG.hours*3600*1000;
  const fthr=1-(FIRECFG.pct/100);
  const deal=isBin && fresh6 && ((FIRECFG.vsPaid && num(it.paid_avg)!=null && num(it.price)<=num(it.paid_avg)*fthr) || (FIRECFG.vsRaw && num(it.raw)!=null && num(it.price)<=num(it.raw)*fthr));
  document.getElementById("lBody").innerHTML=`
    <div class="cardimg">${it.image_url?`<img src="${escH(it.image_url)}" alt="">`:""}</div>
    <div style="font-size:18px;font-weight:700;margin:2px 0 6px">${deal?"🔥 ":""}${money2(it.price)} <span class="muted" style="font-size:12px;font-weight:400">${(it.buying_options||"").includes("AUCTION")?"Auction":(isBin?"Buy It Now":"")}${it.ship_cost?" · incl. "+money2(it.ship_cost)+" ship":(it.ship_cost===0?" · free ship":"")}</span></div>
    <div class="note" style="margin:0 0 10px">${escH(it.title||"")}</div>
    <div class="kv">
      <div class="k">Price (landed)</div><div class="v">${money2(it.item_price)} item + ${it.ship_cost==null?'<span class="muted">calc. ship</span>':(it.ship_cost===0?"free ship":money2(it.ship_cost)+" ship")} = <b>${money2(it.price)}</b></div>
      <div class="k">Card</div><div class="v">${escH(it.name||"")} ${escH(it.parallel||"")}</div>
      <div class="k">Set</div><div class="v">${escH((it.set_name||"").replace(" (EN)",""))}</div>
      <div class="k">Year</div><div class="v">${escH(it.season||"—")}</div>
      <div class="k">Card #</div><div class="v">${escH(it.card_number||"—")}</div>
      <div class="k">Condition</div><div class="v">${escH(it.condition||"—")}</div>
      <div class="k">Type</div><div class="v">${(it.buying_options||"").includes("AUCTION")?((it.buying_options||"").includes("FIXED_PRICE")?"Auction + Buy It Now (A)":"Auction (A)"):(isBin?"Buy It Now (B)":"—")}</div>
      <div class="k">Seller</div><div class="v">${escH(it.seller_username||"—")}</div>
      <div class="k">Seller reviews</div><div class="v">${sc==null?"—":(+sc).toLocaleString()}${pct==null?"":" · "+pct+"% pos"}</div>
      <div class="k">Listed</div><div class="v">${timeAgo(it.first_seen)}${it.first_seen?` <span class="muted">(${escH(absTime(it.first_seen))})</span>`:""}</div>
      <div class="k">Gem rate</div><div class="v">${it.gem_rate==null?"—":Math.round(num(it.gem_rate)*100)+"%"}</div>
      <div class="k">PSA 10 ref</div><div class="v">${money2(it.psa10)}</div>
      <div class="k">Raw ref</div><div class="v">${money2(it.raw)}</div>
      <div class="k">PSA 9 ref</div><div class="v">${money2(it.psa9)}</div>
      <div class="k">Avg you paid</div><div class="v">${it.paid_avg==null?"—":money2(it.paid_avg)}</div>
      <div class="k">Est. profit @ this price</div><div class="v">${prof==null?"—":`<span class="${prof>=0?'pos':'neg'}">${money2(prof)}</span>`}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;margin:8px 0">
      ${srcPillL('📊','PriceCharting', pcRawL, pcP10L, 'pricecharting','#eef2f7','#d5deea','#33506e')}
      <div id="pdTagL" class="srcpill" style="display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;background:#fdeeee;border:1px solid #f0cccc;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:#8a2b2b"><span>🔴 PokeData</span><span class="pv-slot" style="margin-left:auto;text-align:right"><span style="opacity:.6">…</span></span></div>
    </div>
    <a class="ebtn primary" href="${escH(it.url||"#")}" target="_blank" rel="noopener">🔎 View / Buy on eBay ↗</a>
    <button class="notint" id="notIntBtn">🚫 Not interested — hide this listing</button>
    <div class="note">Est. profit uses the flat $20 PSA fee + $3 handling.</div>`;
  document.getElementById("notIntBtn").onclick=()=>dismissListing(it);
  fillPdTag(it,"pdTagL");
  document.getElementById("lov").classList.add("on");
  document.getElementById("lside").classList.add("on");
}
async function dismissListing(it){
  if(sb&&SESSION){ try{ await sb.from("listing_dismissals").insert({user_id:SESSION.user.id,item_id:it.item_id}); }catch(e){} }
  LB=LB.filter(x=>x.item_id!==it.item_id);
  closeListing(); renderLetsBuy();
}
function closeGallery(){ document.getElementById("gov").classList.remove("on"); document.getElementById("gmodal").classList.remove("on"); }
function openGallery(g){
  if(!g) return;
  const now=Date.now(), DAY=86400*1000;
  const items=g.items.filter(it=>now-new Date(it.first_seen).getTime()<=DAY)
    .sort((a,b)=>new Date(b.first_seen).getTime()-new Date(a.first_seen).getTime());
  document.getElementById("gTitle").innerHTML=`🖼 ${escH(g.rep.name||g.rep.title)} <span class="muted">${escH(g.rep.parallel||"")}</span> — ${items.length} new in last 24h`;
  const body=document.getElementById("gbody");
  if(!items.length){ body.innerHTML='<p class="note">No new listings for this card in the last 24 hours.</p>'; }
  else {
    body.innerHTML='<div class="note" style="margin-top:0">Newest first. Tap the image (or Buy) to open on eBay; Ignore hides a listing everywhere.</div><div class="ggrid">'+items.map(it=>{
      const deal=isBinDeal(it,g), ty=binOf(it);
      return `<div class="gcard" data-item="${escH(it.item_id)}"><div class="gimg"><a href="${escH(it.url||"#")}" target="_blank" rel="noopener">${it.image_url?`<img src="${escH(it.image_url)}" alt="" loading="lazy">`:""}</a></div>`+
        `<div class="gmeta"><div class="gprice">${deal?"🔥 ":""}${money2(it.price)} <span class="muted" style="font-size:11px;font-weight:400">${ty==="B"?"BIN":ty==="A"?"Auction":""}</span></div>`+
        `<div class="gtime" title="${escH(absTime(it.first_seen))}">🕒 ${timeAgo(it.first_seen)}</div></div>`+
        `<div class="gbtns"><button class="gignore" data-item="${escH(it.item_id)}">🚫 Ignore</button><a class="gbuy" href="${escH(it.url||"#")}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">🛒 Buy</a></div></div>`;
    }).join("")+'</div>';
    body.querySelectorAll(".gignore").forEach(btn=>btn.onclick=async(ev)=>{
      ev.stopPropagation(); const id=btn.dataset.item;
      const it=g.items.find(x=>String(x.item_id)===String(id));
      if(sb&&SESSION&&it){ try{ await sb.from("listing_dismissals").insert({user_id:SESSION.user.id,item_id:it.item_id}); }catch(e){} }
      LB=LB.filter(x=>String(x.item_id)!==String(id));
      g.items=g.items.filter(x=>String(x.item_id)!==String(id));
      const card=body.querySelector(`.gcard[data-item="${CSS.escape(id)}"]`);
      if(card){ card.classList.add("gone"); card.querySelectorAll("button,a").forEach(el=>el.style.pointerEvents="none"); }
      renderLetsBuy();
    });
  }
  document.getElementById("gov").classList.add("on");
  document.getElementById("gmodal").classList.add("on");
}

async function boot(){
  try{
    syncControls(); bind(); await buildSeasonChips(); renderAuth(); initAuth();
    (function(){ const hdr=document.getElementById("filterHdr"), bd=document.getElementById("filterBody"), car=document.getElementById("filterCaret");
      if(!hdr) return; let open=localStorage.getItem("voltdash.filtersOpen")!=="0";
      const apply=()=>{ bd.style.display=open?"":"none"; car.textContent=open?"▾ Hide":"▸ Show"; };
      apply(); hdr.onclick=()=>{ open=!open; localStorage.setItem("voltdash.filtersOpen", open?"1":"0"); apply(); }; })();
    document.getElementById("sClose").onclick=closeSide;
    document.getElementById("ov").onclick=closeSide;
    document.getElementById("addPurchaseBtn").onclick=openAddForm;
    document.getElementById("refreshPurchasesBtn").onclick=async(e)=>{
      const b=e.currentTarget; if(!sb||!SESSION){ openPurchases(); return; }
      b.disabled=true; const t=b.textContent; b.textContent="⏳ Checking eBay…";
      try{ await sb.functions.invoke("refresh-orders",{body:{days:7}}); }catch(err){ /* re-query anyway */ }
      await openPurchases();
      b.disabled=false; b.textContent=t;
    };
    document.getElementById("scanBtn").onclick=openScan;
    document.getElementById("scanClose").onclick=closeScan;
    document.getElementById("scanov").onclick=closeScan;
    document.getElementById("favBtnTop").onclick=openFavorites;
    document.getElementById("fClose").onclick=closeFav;
    document.getElementById("fov").onclick=closeFav;
    document.getElementById("lClose").onclick=closeListing;
    document.getElementById("lov").onclick=closeListing;
    document.getElementById("gClose").onclick=closeGallery;
    document.getElementById("gov").onclick=closeGallery;
    document.getElementById("uClose").onclick=closeFixUnmatched;
    document.getElementById("uov").onclick=closeFixUnmatched;
    document.querySelectorAll("#topnav .navbtn[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));
    document.getElementById("subLetsBuy").onclick=()=>showBuySub("letsbuy");
    document.getElementById("subDealFeed").onclick=()=>showBuySub("dealfeed");
    // login gate wiring
    const gEmail=()=>(document.getElementById("gateEmail").value||"").trim();
    document.getElementById("gateSignIn").onclick=()=>signInPw(gEmail(),document.getElementById("gatePw").value||"");
    document.getElementById("gatePw").addEventListener("keydown",e=>{ if(e.key==="Enter") signInPw(gEmail(),document.getElementById("gatePw").value||""); });
    document.getElementById("gateLink").onclick=()=>signIn(gEmail());
    document.querySelector("#tbl tbody").addEventListener("click",e=>{
      const tr=e.target.closest("tr[data-i]"); if(!tr) return;
      const r=VIEW[+tr.dataset.i]; if(!r) return;
      if(e.target.closest(".valmark")){ toggleValue(r); render(); return; }
      if(e.target.closest(".star")){ toggleFav(r); render(); return; }
      if(e.target.closest(".discSales")){ const w=window.open(discEbaySoldUrl(r),"_blank"); if(w) w.opener=null; return; }
      if(e.target.closest(".discListed")){ discToggleListed(tr,r); return; }
      openCard(r);
    });
    // data loads via applyGate() once the user is authenticated (see initAuth)
  }catch(err){
    document.getElementById("sub").innerHTML=`<span class="err">Couldn't load data: ${err.message}. Use the Reload button after the connector is ready.</span>`;
  }
}

// ---- keep scroll position when leaving to eBay and coming back (survives an iOS reload) ----
(function(){
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  const KEY='voltdash.scroll';
  let PENDING=null, restoring=false;
  // the element that actually scrolls (a visible buy sub-panel body, else the window)
  function scroller(){
    for(const id of ["dfbody","bbody","pbody"]){ const el=document.getElementById(id);
      if(el && el.offsetParent!==null && el.scrollHeight>el.clientHeight+4) return el; }
    return null;
  }
  function curY(){ const el=scroller(); return el?el.scrollTop:(window.scrollY||document.documentElement.scrollTop||0); }
  function setY(y){ const el=scroller(); if(el) el.scrollTop=y; else window.scrollTo(0,y); }
  function save(){ if(restoring) return; try{ localStorage.setItem(KEY, JSON.stringify({y:curY(), t:Date.now()})); }catch(e){} }
  function read(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||"null"); return (d && Date.now()-d.t < 1800000)? d.y : null; }catch(e){ return null; } }
  // apply the saved position, retrying across frames until the async content is tall enough (or ~6s)
  function apply(fresh){
    if(fresh) PENDING=read();
    if(PENDING==null || restoring) return;
    restoring=true; const target=PENDING, t0=Date.now();
    (function step(){
      setY(target);
      if(Math.abs(curY()-target)<=3 || Date.now()-t0>6000){ PENDING=null; restoring=false; return; }
      requestAnimationFrame(step);
    })();
  }
  window.__voltApplyScroll=()=>apply(false);   // called by views after they finish rendering
  let t; addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(save,100); },{passive:true,capture:true});
  addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',()=>{ document.visibilityState==='hidden'?save():apply(true); });
  addEventListener('pageshow',e=>{ if(e.persisted) apply(true); });
  addEventListener('load',()=>apply(true));
})();

boot();
</script>

<script>
(function(){
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let ZX=null;
  async function loadZX(){ if(ZX) return ZX;
    const urls=["https://esm.sh/zxing-wasm@2/reader","https://cdn.jsdelivr.net/npm/zxing-wasm@2/+esm"];
    for(const u of urls){ try{ ZX=await import(u); if(ZX&&ZX.readBarcodes) return ZX; }catch(e){} }
    ZX=null; return ZX;
  }
  function trkFromText(t){ const m=String(t).match(/\(420\)\d+\((9\d)\)(\d{20})/); if(m) return m[1]+m[2]; const d=(String(t).replace(/\s/g,"").match(/\b9\d{21}\b/)||[])[0]; return d||null; }
  async function decodeFile(file){
    const z=await loadZX(); if(!z) return [];
    try{ const res=await z.readBarcodes(file,{tryHarder:true,maxNumberOfSymbols:80,formats:["DataMatrix","Code128","QRCode","ITF","Code39"]});
      return res.map(r=>trkFromText(r.text)).filter(Boolean);
    }catch(e){ return []; }
  }
  function fileToImg(file){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  async function downscale(file,max=1568,q=0.72){
    try{ const img=await fileToImg(file); const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q);
    }catch(e){ return null; }
  }

  let BC={staged:[],unmatched:[],recon:[],messages:[],busy:false};
  const bodyEl=()=>document.getElementById("bcBody");
  const footEl=()=>document.getElementById("bcConfirm");

  function openBatch(){
    if(typeof sb==='undefined'||!sb||!SESSION){ alert("Sign in first so check-ins log to your account."); return; }
    BC={staged:[],unmatched:[],recon:[],messages:[],busy:false};
    footEl().onclick=doCommit;
    document.getElementById("bcov").style.display="block";
    document.getElementById("bcModal").classList.add("on");
    renderUpload();
  }
  function closeBatch(){ document.getElementById("bcov").style.display="none"; document.getElementById("bcModal").classList.remove("on"); }

  function renderUpload(){
    bodyEl().innerHTML=`
      <div class="bcmuted" style="margin-bottom:8px">Drop photos of the arrived mail (envelopes, mailers, boxes) and any photos of the loose cards. I'll read the shipping labels, match them to your orders, and stage check-ins for Steve to confirm.</div>
      <label class="bcdrop" id="bcDrop">
        <div style="font-size:30px">📸</div>
        <div style="font-weight:700;margin-top:4px">Tap to add photos</div>
        <div class="bcmuted">or drop them here</div>
        <input id="bcFiles" type="file" accept="image/*" multiple style="display:none">
      </label>
      <div id="bcStatus" class="bcmuted" style="margin-top:10px"></div>`;
    const inp=document.getElementById("bcFiles"), drop=document.getElementById("bcDrop");
    // The label opens its file input natively; no recursive click handler.
    drop.ondragover=e=>{e.preventDefault();}; drop.ondrop=e=>{e.preventDefault(); if(e.dataTransfer.files.length) doProcess(e.dataTransfer.files);};
    inp.onchange=()=>{ if(inp.files.length) doProcess(inp.files); };
    footEl().disabled=true; footEl().textContent="Upload photos to start";
  }

  async function doProcess(fileList){
    const files=[...fileList].filter(f=>f.type.startsWith("image/")); if(!files.length||BC.busy) return;
    BC.busy=true;
    const st=document.getElementById("bcStatus");
    const set=t=>{ if(st) st.textContent=t; };
    set("Reading "+files.length+" photo(s) — decoding barcodes…");
    const barcodes=new Set(); const images=[];
    for(let i=0;i<files.length;i++){
      set(`Decoding barcodes ${i+1}/${files.length}…`);
      (await decodeFile(files[i])).forEach(t=>barcodes.add(t));
      const d=await downscale(files[i]); if(d) images.push(d);
    }
    set(`Found ${barcodes.size} tracking barcode(s). Reading envelopes + cards with Claude…`);
    try{
      const {data,error}=await sb.functions.invoke("batch-checkin",{body:{action:"process",barcodes:[...barcodes],images}});
      if(error){ let msg=error.message; try{ const j=await error.context.json(); if(j&&j.error) msg=j.error; }catch(_){} throw new Error(msg||"request failed"); }
      if(data.error) throw new Error(data.error);
      BC.staged=data.staged||[]; BC.unmatched=data.unmatched||[]; BC.recon=data.recon||[];
      BC.messages=[{role:"assistant",content:data.assistantMessage||"Done."}];
      BC.busy=false; renderReview();
    }catch(e){ BC.busy=false; set("⚠ "+e.message); }
  }

  function renderReview(){
    const rows=BC.staged.map(s=>`<label class="bcrow"><input type="checkbox" data-id="${s.id}" checked><div style="flex:1">${esc(s.card_number?("#"+s.card_number+" "):"")}${esc(s.title||("row "+s.id))}</div><span class="bcsrc">${esc(s.source||"")}</span></label>`).join("")||`<div class="bcmuted">Nothing matched yet.</div>`;
    let recon=""; if(BC.recon&&BC.recon.length){ recon=`<div class="bcsec">Loose-card reconciliation</div><table class="bctable"><tr><th>Card</th><th>In photos</th><th>Already today</th><th>Adding</th></tr>`+BC.recon.map(r=>`<tr><td>${esc(r.card)}</td><td>${r.present}</td><td>${r.received_today+(r.staging_now||0)}</td><td>${r.will_add}</td></tr>`).join("")+`</table>`; }
    let unm=""; if(BC.unmatched&&BC.unmatched.length){ unm=`<div class="bcsec">No match — eBay never synced tracking (${BC.unmatched.length})</div><div class="bcmuted" style="word-break:break-all">${BC.unmatched.map(esc).join(", ")}</div><div class="bcmuted" style="margin-top:3px">Tell me what these are in the chat (e.g. "the Mega Gardevoir is one of these") and I'll match them by card.</div>`; }
    const chat=`<div class="bcchat"><div id="bcMsgs">${BC.messages.map(m=>`<div class="bcmsg ${m.role==='user'?'u':'a'}"><span class="b">${esc(m.content)}</span></div>`).join("")}</div><div class="bcchatin"><input id="bcInput" placeholder="Ask or correct — e.g. 'Clefairy is 7 not 6'"><button id="bcSend">Send</button></div></div>`;
    bodyEl().innerHTML=`<div class="bcsec">Will check in for Steve (${BC.staged.length})</div><div id="bcList">${rows}</div>${recon}${unm}${chat}`;
    const send=()=>{ const v=(document.getElementById("bcInput").value||"").trim(); if(v) sendChat(v); };
    document.getElementById("bcSend").onclick=send;
    document.getElementById("bcInput").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
    updateConfirm();
    bodyEl().querySelectorAll('#bcList input[type=checkbox]').forEach(c=>c.onchange=updateConfirm);
  }
  function checkedIds(){ return [...bodyEl().querySelectorAll('#bcList input[type=checkbox]:checked')].map(c=>Number(c.dataset.id)); }
  function updateConfirm(){ const n=checkedIds().length; const b=footEl(); b.disabled=n===0||BC.busy; b.textContent=n?`✓ Confirm ${n} check-in${n>1?"s":""}`:"Select cards to check in"; }

  async function sendChat(text){
    BC.messages.push({role:"user",content:text});
    const msgs=document.getElementById("bcMsgs"); if(msgs) msgs.insertAdjacentHTML("beforeend",`<div class="bcmsg u"><span class="b">${esc(text)}</span></div><div class="bcmsg a" id="bcPending"><span class="b">…</span></div>`);
    document.getElementById("bcInput").value="";
    try{
      const {data,error}=await sb.functions.invoke("batch-checkin",{body:{action:"chat",messages:BC.messages,context:{staged:BC.staged,unmatched:BC.unmatched,recon:BC.recon}}});
      if(error) throw new Error(error.message); if(data.error) throw new Error(data.error);
      BC.staged=data.staged||BC.staged; BC.messages.push({role:"assistant",content:data.assistantMessage||"Done."});
      renderReview();
    }catch(e){ const p=document.getElementById("bcPending"); if(p) p.querySelector(".b").textContent="⚠ "+e.message; }
  }

  async function doCommit(){
    const ids=checkedIds(); if(!ids.length) return;
    BC.busy=true; const b=footEl(); b.disabled=true; b.textContent="Checking in…";
    try{
      const {data,error}=await sb.functions.invoke("batch-checkin",{body:{action:"commit",ids}});
      if(error) throw new Error(error.message); if(data.error) throw new Error(data.error);
      bodyEl().innerHTML=`<div style="text-align:center;padding:30px 10px"><div style="font-size:38px">✅</div><h3 style="margin:8px 0 2px">Checked in ${data.committed} card(s) for Steve</h3><p class="bcmuted">They're marked received. Refresh Purchased to see them.</p></div>`;
      b.textContent="Done"; b.disabled=false; b.onclick=()=>{ closeBatch(); try{ if(typeof openPurchases==="function") openPurchases(); }catch(e){} };
    }catch(e){ b.textContent="✓ Confirm"; b.disabled=false; BC.busy=false; alert("Check-in failed: "+e.message); }
  }

  function wire(){
    const b=document.getElementById("batchBtn"); if(b) b.onclick=openBatch;
    const c=document.getElementById("bcClose"); if(c) c.onclick=closeBatch;
    const o=document.getElementById("bcov"); if(o) o.onclick=closeBatch;
    const f=document.getElementById("bcConfirm"); if(f) f.onclick=doCommit;
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wire); else wire();
  window.openBatch=openBatch;
})();
</script>
