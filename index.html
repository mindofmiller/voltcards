<!-- OneSignal Web Push (v16) -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.ONESIGNAL_APP_ID = "6bcb6bc3-2743-49e9-9f3d-9658bb8caa9d";
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  // One-time "integration complete" verification dialog (per OneSignal integration guide)
  function voltShowIntegrationComplete(){
    try { if (localStorage.getItem("voltdash.osVerified")) return; } catch(_e){}
    if (document.getElementById("osComplete")) return;
    const ov=document.createElement("div"); ov.id="osComplete";
    ov.style.cssText="position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:22px";
    ov.innerHTML='<div style="background:#fff;border-radius:16px;max-width:360px;width:100%;padding:22px 20px;box-shadow:0 16px 50px rgba(0,0,0,.35)"><div style="font-size:17px;font-weight:800;margin-bottom:8px">Your OneSignal SDK integration is complete!</div><div style="font-size:14px;color:#28303f;line-height:1.5;margin-bottom:16px">You can now send Push Notifications &amp; In-App Messages through OneSignal. Tap below to enable push notifications.</div><button id="osGotIt" style="width:100%;padding:12px;border:none;border-radius:10px;background:#c14b3f;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Got it</button></div>';
    document.body.appendChild(ov);
    ov.querySelector("#osGotIt").onclick=function(){ try{localStorage.setItem("voltdash.osVerified","1");}catch(_e){} ov.remove(); window.OneSignalDeferred.push(async function(OneSignal){ try{ await OneSignal.Notifications.requestPermission(); }catch(_e){} try{ await OneSignal.User.PushSubscription.optIn(); }catch(_e){} }); };
  }
  if (window.ONESIGNAL_APP_ID) {
    window.OneSignalDeferred.push(async function(OneSignal){
      try {
        await OneSignal.init({
          appId: window.ONESIGNAL_APP_ID,
          serviceWorkerPath: "/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/" },
          allowLocalhostAsSecureOrigin: true
        });
        // A real, server-assigned subscription id is non-empty and not the local- placeholder
        const isReg = id => !!id && !String(id).startsWith("local-");
        let shown=false; const done=()=>{ if(shown) return; shown=true; voltShowIntegrationComplete(); };
        try {
          OneSignal.User.PushSubscription.addEventListener("change", function(e){ if(e && e.current && isReg(e.current.id)) done(); });
          if (isReg(OneSignal.User.PushSubscription.id)) done();
        } catch(_e){}
      } catch(e) { /* init once */ }
    });
  }
  // called by the "Enable deal alerts" button (must be a direct user tap on iOS)
  window.enableVoltPush = async function(cb){
    if (!window.ONESIGNAL_APP_ID) { alert("Push isn't set up yet — OneSignal App ID missing."); return; }
    window.OneSignalDeferred.push(async function(OneSignal){
      try {
        await OneSignal.Notifications.requestPermission();
        try { await OneSignal.User.PushSubscription.optIn(); } catch(_e){}
        if (cb) cb(OneSignal.Notifications.permission === true);
      } catch(e){ if (cb) cb(false); }
    });
  };
  window.voltPushStatus = function(cb){
    if (!window.ONESIGNAL_APP_ID) { cb && cb("unconfigured"); return; }
    window.OneSignalDeferred.push(function(OneSignal){
      cb && cb(OneSignal.Notifications.permission === true ? "on" : "off");
    });
  };
</script>

<style>
/* Deal Feed card image: zoom in on hover; click still opens the eBay listing (the img is inside the <a>). */
.dfimgwrap{overflow:hidden}
/* No auto-zoom on hover — the image only scales when the user scroll-zooms. transform-origin tracks the cursor to pan. */
.dfimgwrap .dfimg{transition:transform .12s ease;transform-origin:center center;will-change:transform}
.dfimgwrap.panning .dfimg{transition:none}
:root{
  color-scheme: light;
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1a2233; --muted:#6b7488; --line:#e4e7ef;
  --accent:#c14b3f; --good:#2f9e57; --goodbg:#e7f6ec; --warn:#c98a00; --bad:#d1435b;
  --op:#e8590c; --pk:#3b5bdb; --mg:#7048e8; --chip:#eef1f8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{padding:16px;max-width:1400px;margin:0 auto}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:700;margin-top:2px}
.stat .s{font-size:11px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.rng{display:flex;align-items:center;gap:6px}
.rng input{min-width:0}
.rng span{color:var(--muted)}
label.fld{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
select,input[type=number],input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--chip);cursor:pointer;user-select:none;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toggles{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tg{display:flex;gap:6px;align-items:center;cursor:pointer;font-size:12px}
.chartbox{height:340px;position:relative}
.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
th{position:sticky;top:0;background:#f0f2f8;cursor:pointer;user-select:none;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);z-index:1}
th.sort::after{content:" \2195";opacity:.4}
th.asc::after{content:" \2191";opacity:.9}
th.desc::after{content:" \2193";opacity:.9}
/* clip cell text to its own column so long values don't overlap the next column */
#tbl th,#tbl td,.ptbl td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardimg{text-align:center;margin-bottom:10px}
.cardimg img{max-height:230px;max-width:100%;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
tr.out td{background:var(--goodbg)}
tr.out td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.g-op{color:var(--op)}.g-pokemon{color:var(--pk)}.g-magic{color:var(--mg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pos{color:var(--good)}.neg{color:var(--bad)}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip)}
.muted{color:var(--muted)}
.err{color:var(--bad);padding:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px}
.legend span{display:flex;align-items:center}
footer{color:var(--muted);font-size:11px;margin-top:12px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#eef3ff}
tr.out:hover td{background:#dff0e4}

/* sidebar */

.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}

.favbtn.on{background:#fff7e0;border-color:#e6c34d;color:#8a6d00}

.stage.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.clr{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:8px;text-decoration:underline}
.authbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-4px 0 10px;font-size:12px;flex-wrap:wrap}
.authbar .ain{width:190px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}

function looksLikeRows(a){
  return Array.isArray(a) && (a.length===0 || (a[0] && typeof a[0]==="object" && ROWKEYS.some(k=>k in a[0])));
}
// Recursively locate the rows array regardless of how the connector nests/wraps it.
function findRows(x,depth){
  if(x==null||depth>6) return null;
  if(looksLikeRows(x)) return x;
  if(Array.isArray(x)){ for(const it of x){ const r=findRows(it,depth+1); if(r) return r; } return null; }
  if(typeof x==="string"){
    let o=null; try{o=JSON.parse(x);}catch(_){}
    if(o){ const r=findRows(o,depth+1); if(r) return r; }
    const s=x.indexOf("["), e=x.lastIndexOf("]");

    return null;
  }
  if(typeof x==="object"){ for(const k in x){ const r=findRows(x[k],depth+1); if(r) return r; } }
  return null;
}

// price_changes/window-function comment in loadSeason() below) and was the direct cause of a real
// statement-timeout the user hit (2026-08-29). 2018+ covers the actual card pool without the DB load
// of the full ~40-year range. Only applies to a FRESH browser (nothing in localStorage yet) --
// Object.assign below lets any already-saved `seasons` value override this, same as every other field.
const DEFAULT_SEASONS=(()=>{ const arr=[]; for(let y=new Date().getFullYear();y>=2018;y--) arr.push(String(y)); return arr; })();
const st = Object.assign({seasons:DEFAULT_SEASONS,games:[],set:"__all",q:"",profMin:0,volT:0,gemsMin:0,liq:true,hideUn:true,lowConfHide:false,hideInac:false,date:null,
  rawMin:null,rawMax:null,p10Min:null,p10Max:null,roiMin:null,roiMax:null,gemPctMin:null,gemPctMax:null,valueOnly:false,favOnly:false},
  JSON.parse(localStorage.getItem(LS)||"{}"));
st.date=null; // never trust a previously-persisted snapshot week (incl. from before this fix) — always default to latest on load
function save(){
  // "date" (snapshot week) is intentionally excluded from persistence: it should always
  // default to the latest available week on a fresh visit, not stay pinned to whatever
  // week was last viewed (old weeks remain valid dropdown options forever, so a naive
  // "is it still valid" check never catches a stale pin).
  const {date, ...persisted} = st;
  localStorage.setItem(LS, JSON.stringify(persisted));
}

// Gem rate basis toggle: all-time (default) vs. GemRate's trailing-past-month rate. All-time gem rate
// drifts as a set ages -- the cleanest/best-centered copies get graded early, so a set's all-time rate
// can look much rosier than what a fresh submission would actually get years later once those have
// already been picked through. Past-month reflects current grading reality instead. Falls back to
// all-time per-card when a card has no monthly figure yet (not every set has been enriched with it).
let GR_MODE=(()=>{try{return localStorage.getItem("voltdash.grmode")||"all";}catch(e){return "all";}})();
const MAXBUY_ROI=1.25;   // target ROI behind the "Max buy" column (1.25 = 125%)
function setGrMode(m){ GR_MODE=m; try{localStorage.setItem("voltdash.grmode",m);}catch(e){} RAW=RAW.map(enrich); if(typeof render==="function") render(); }
function enrich(r){
  const grAll=num(r.gem_rate), grMonth=num(r.gem_rate_month), grOverride=num(r.gem_rate_override);
  // A manual override wins over both bases outright -- it exists specifically to correct a gem rate
  // the user already knows is wrong (stale population data, a bad import, etc.), so it shouldn't be
  // second-guessed by the all-time/past-month toggle underneath it.
  const gr = grOverride!=null ? grOverride : ((GR_MODE==="month" && grMonth!=null) ? grMonth : grAll);
  const raw=num(r.raw), p9=num(r.psa9), p10=num(r.psa10);
  const priced = raw!=null && p9!=null && p10!=null && p9>0;
  let profit=null, roi=null, liqOk=false, maxbuy=null;
  if(priced){
    const cost = costFor(raw);
    profit=(gr*p10 + (1-gr)*p9)*0.88 - cost - raw;
    roi = profit/(raw + cost);
    liqOk = p10 <= 5*p9;
    // Highest raw price you can pay and still hit MAXBUY_ROI. Same math as the ROI column: ROI = (E - cost - raw)/(raw + cost) with
    // E = (gem% x PSA10 + (1-gem%) x PSA9) x 0.88, so ROI >= T  <=>  raw <= E/(1+T) - cost. (cost = grading fee + handling, flat.)
    const E=(gr*p10 + (1-gr)*p9)*0.88;
    maxbuy = E/(1+MAXBUY_ROI) - costFor(0);
  }
  return Object.assign({}, r, {gr,grAll,grMonth,grOverride,raw,p9,p10,priced,profit,roi,liqOk,maxbuy,
    mraw:num(r.mkt_raw), mp9:num(r.mkt_psa9), mp10:num(r.mkt_psa10),
    score:(profit!=null&&roi!=null)?profit*roi:-1e9, d10:num(r.psa10_chg), d10mo:num(r.psa10_chg_mo), draw:num(r.raw_chg), drawmo:num(r.raw_chg_mo)});
}

// ---- price staleness: distinct from snapshot_date (which advances every week regardless of
// whether a real fresh match was found). price_updated_at only moves when a genuine live match
// happened, so a card silently carried forward unchanged shows its true age here instead of
// looking freshly priced. Thresholds match the "once a week, never 2 months stale" target:
// fresh <=10d (a bit of slack past the weekly cadence), aging 11-30d, stale beyond that.
function priceAgeDays(r){ const t=r&&r.price_updated_at; if(!t) return null; const ms=Date.now()-new Date(t).getTime(); return isFinite(ms)?Math.floor(ms/86400000):null; }
function staleTier(days){ if(days==null) return "unknown"; if(days<=10) return "fresh"; if(days<=30) return "aging"; return "stale"; }
// Compact badge for tables/cards. showFresh=true also renders a (quiet) badge for fresh prices,
// e.g. in the card detail panel where "priced 2d ago" is useful context even when it's not a warning.
function staleBadge(r, opts){
  opts=opts||{};
  const days=priceAgeDays(r), tier=staleTier(days);
  // A manual price (Adjust Price / Double Check) is pinned on purpose and the weekly refresh skips it, so its age keeps growing
  // even though the price feed is fine. Say so next to the age, so "stale" can't be mistaken for a broken feed.
  const manual=!!(r&&(r.price_confidence==="manual"||/\(manual\)/i.test(r.pc_product||"")));
  const manualChip=manual?` <span title="You set this price by hand, so the weekly price refresh leaves it alone. The age shown is the last time the feed confirmed it — it is not a feed problem. Open the card's price adjuster and click “Reset to market” to let the feed price it again." style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:#e8e1fb;color:#5b3cc4;white-space:nowrap">✏ manual price</span>`:"";
  if(tier==="fresh" && !opts.showFresh) return manualChip.trim();
  const label = tier==="unknown" ? "age unknown" : tier==="fresh" ? `${days}d ago` : tier==="aging" ? `⚠ ${days}d old` : `⚠ STALE ${days}d`;
  const col = tier==="unknown" ? "#7a8394" : tier==="fresh" ? "#7a8394" : tier==="aging" ? "#8a6d00" : "#b3261e";
  const bg = tier==="stale" ? "#fde4e1" : tier==="aging" ? "#fff4d6" : "#eef0f6";
  const title = days==null ? "Price age unknown — not yet checked since staleness tracking was added" : `Price last confirmed ${days} day${days===1?'':'s'} ago`;
  return `<span title="${escH(title)}" style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:${bg};color:${col};white-space:nowrap">${label}</span>${manualChip}`;
}
// Inline flag for price_confidence==='low' rows -- previously this was only visible by opening
// the card detail panel, so a low-confidence price (a matching-site data glitch, e.g. PSA9 priced
// at 70x raw for a thin-market parallel) could sort straight to the top of a table's ROI column
// looking exactly like a trustworthy result. Prepend to any cell built from a possibly-unreliable
// number (PSA9/PSA10/ROI) so the warning travels with the number wherever it's shown, not just
// behind an opt-in "hide low-confidence" filter that defaults off.
function lowConfMark(r){
  if(r.price_confidence!=="low") return "";
  return `<span title="Low-confidence match — the pricing site's own data looks unreliable for this card (e.g. PSA9 priced far above what a normal grading premium would suggest). Verify before acting on this number." style="color:#b3261e;font-weight:800;margin-right:2px;cursor:help">⚠</span>`;
}

function dotR(x){ const v=num(x.total)||0; return Math.max(2.5, Math.min(16, 2.5+Math.sqrt(v)/8)); }

function filtered(){
  return RAW.filter(x=>{
    if(st.games.length && !st.games.includes(x.game)) return false;
    if(st.set!=="__all" && x.set_name!==st.set) return false;
    if(st.hideUn && !x.priced) return false;
    if(st.liq && x.priced && !x.liqOk) return false;
    if(st.lowConfHide && x.price_confidence==="low") return false;
    if(st.hideInac && isInac(x)) return false;
    if(st.valueOnly && !isValue(x)) return false;
    if(st.favOnly && !isFav(x)) return false;
    if(num(x.volume)!=null && num(x.volume) < st.volT) return false;
    if(st.gemsMin>0){ if(num(x.gems)==null || num(x.gems) < st.gemsMin) return false; }
    if(st.gemPctMin!=null){ if(x.gr==null || x.gr*100 < st.gemPctMin) return false; }
    if(st.gemPctMax!=null){ if(x.gr==null || x.gr*100 > st.gemPctMax) return false; }
    if(st.rawMin!=null){ if(x.raw==null || x.raw < st.rawMin) return false; }
    if(st.rawMax!=null){ if(x.raw==null || x.raw > st.rawMax) return false; }
    if(st.p10Min!=null){ if(x.p10==null || x.p10 < st.p10Min) return false; }
    if(st.p10Max!=null){ if(x.p10==null || x.p10 > st.p10Max) return false; }
    if(st.roiMin!=null){ if(x.roi==null || x.roi*100 < st.roiMin) return false; }
    if(st.roiMax!=null){ if(x.roi==null || x.roi*100 > st.roiMax) return false; }
    if(st.profMin>0){ if(!x.priced || x.profit < st.profMin) return false; }
    if(st.q){
      // "-word" excludes rows containing that word (e.g. "-now" hides Topps Now cards) instead of
      // requiring it, same convention as eBay/Google search. A bare positive token still must be present.
      const toks=st.q.toLowerCase().split(/\s+/).filter(Boolean);
      const s=((x.name||"")+" "+(x.parallel||"")+" "+(x.card_number||"")+" "+(x.set_name||"")).toLowerCase();
      for(const t of toks){
        if(t.length>1 && t[0]==="-"){ if(s.includes(t.slice(1))) return false; }
        else if(!s.includes(t)) return false;
      }
    }
    return true;
  });
}

  ["p9","PSA9",r=>lowConfMark(r)+pcLink(r,money(r.p9))],
  ["p10","PSA10",r=>pcLink(r,money(r.p10))],
  ["priced_age","Priced",r=>staleBadge(r,{showFresh:true})],

  ["roi","ROI",r=>r.roi==null?"—":lowConfMark(r)+Math.round(r.roi*100)+"%"],
  ["d10","Δ PSA10 (wk)",r=>{const c=r.d10; if(c==null) return "—"; const prev=(+r.p10)-c, up=c>=0, dollars=(up?'+':'-')+'$'+Math.round(Math.abs(c)).toLocaleString(); const pct=(prev>0)?(c/prev*100):null; const txt=(pct==null)?dollars:(up?'+':'')+pct.toFixed(0)+'%'; return `<span class="${up?'pos':'neg'}" title="${dollars}">${txt}</span>`;}],
  ["d10mo","Δ PSA10 (mo)",r=>{const c=r.d10mo; if(c==null) return "—"; const prev=(+r.p10)-c, up=c>=0, dollars=(up?'+':'-')+'$'+Math.round(Math.abs(c)).toLocaleString(); const pct=(prev>0)?(c/prev*100):null; const txt=(pct==null)?dollars:(up?'+':'')+pct.toFixed(0)+'%'; return `<span class="${up?'pos':'neg'}" title="${dollars}">${txt}</span>`;}],
  ["volume","Vol",r=>num(r.volume)==null?"—":num(r.volume)],
  ["_status","★ / Status",r=>discoverStatusCell(r)],
  ["_inac","Marked wrong",r=>isInac(r)?`<span title="You flagged this price as inaccurate" style="color:#b3261e;font-weight:700">⚠ Wrong</span>`:""],

// persisted main-table layout (order / hidden / widths)
const MLKEY="voltdash.maincols";
function loadML(){ let p={}; try{p=JSON.parse(localStorage.getItem(MLKEY)||"{}");}catch(e){}
  const def=COLS.map(c=>c[0]);
  let order=Array.isArray(p.order)?p.order.filter(k=>def.includes(k)):[];
  const addMaxbuy=Array.isArray(p.order) && !p.order.includes("maxbuy");
  def.forEach(k=>{ if(!order.includes(k)) order.push(k); });   // append any new columns

          <div style="font-size:12px;min-width:60px"><span class="pill">${escH(gr)}</span>${cond?` <span class="muted">${escH(cond)}</span>`:""}</div>

        </div>`;};
      html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><b style="font-size:13px">🛒 ${rows.length} live listing${rows.length===1?"":"s"} in Volt</b>${goBtn}</div>`+rows.map(item).join("");

// Zero results while a search is typed: say WHY. The table only holds the years/games you've loaded and

let HINT_SEQ=0;
const qMatch=(x,q)=>{ const s=((x.name||"")+" "+(x.parallel||"")+" "+(x.card_number||"")+" "+(x.set_name||"")).toLowerCase();
  for(const t of q.toLowerCase().split(/\s+/).filter(Boolean)){ if(t.length>1&&t[0]==="-"){ if(s.includes(t.slice(1))) return false; } else if(!s.includes(t)) return false; } return true; };
function filtersKeepSearch(){ const q=st.q; clearAll(); st.q=q; save(); syncControls(); render(); }
async function updateSearchHint(rows){
  const el=document.getElementById("searchHint"); if(!el) return;
  const q=(st.q||"").trim();
  if(!q || rows.length>0){ el.style.display="none"; el.innerHTML=""; return; }
  const seq=++HINT_SEQ;
  const hidden=RAW.filter(x=>qMatch(x,q)).length;
  const base=(hid)=>`${hid?`<div>🔎 <b>${hid.toLocaleString()}</b> card${hid===1?"":"s"} in the loaded years match “${escH(q)}” but are hidden by your other filters (Hide unpriced, liquidity filter, game/set…). <button class="pbtn" id="shClear" style="margin-left:6px">Clear filters, keep search</button></div>`:""}`;
  el.style.display="block"; el.innerHTML=base(hidden)+`<div class="muted" id="shYears">Checking other years…</div>`;
  const wire=()=>{ const b=document.getElementById("shClear"); if(b) b.onclick=filtersKeepSearch; };
  wire();
  try{
    const toks=q.split(/\s+/).filter(t=>t&&!(t.length>1&&t[0]==="-")).map(t=>t.replace(/[*,()"'%\\]/g,"")).filter(Boolean);
    if(!toks.length){ el.style.display=hidden?"block":"none"; document.getElementById("shYears")?.remove(); return; }
    await new Promise(res=>setTimeout(res,350));   // debounce: don't query on every keystroke
    if(seq!==HINT_SEQ) return;
    const rr=await fetch(SB_URL+"/rest/v1/rpc/search_years",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({_toks:toks})});
    if(!rr.ok) throw new Error("search_years "+rr.status);
    const found=await rr.json();
    if(seq!==HINT_SEQ) return;
    const by={}; (found||[]).forEach(x=>{ if(x.season!=null) by[x.season]=Number(x.n)||0; });
    const other=Object.keys(by).filter(y=>!st.seasons.includes(String(y))).sort((a,b)=>b-a);
    const yEl=document.getElementById("shYears"); if(!yEl) return;
    if(other.length){
      yEl.className=""; yEl.innerHTML=`📅 Found in other years: ${other.map(y=>`<button class="pbtn shYr" data-y="${y}" style="margin:0 4px 2px 0">${y} · ${by[y]} card${by[y]===1?"":"s"}</button>`).join("")}<span class="muted" style="font-size:12px">click to load that year</span>`;
      yEl.querySelectorAll(".shYr").forEach(b=>b.onclick=async()=>{ const y=b.dataset.y; if(!st.seasons.includes(y)) st.seasons.push(y); st.set="__all"; save(); buildSeasonChips();
        try{ await loadSeason(); }catch(e){ document.getElementById("sub").innerHTML=`<span class="err">${e.message}</span>`; } });

      yEl.innerHTML=`No card in the database matches “${escH(q)}”. Check the spelling, or use ➕ Add card.`;
    } else { yEl.remove(); if(!hidden) el.style.display="none"; }
    wire();
  }catch(e){ const yEl=document.getElementById("shYears"); if(yEl) yEl.remove(); if(!hidden) el.style.display="none"; }
}
function csvEsc(v){ v=(v==null)?"":String(v); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
// Plain-text value per column for export — mirrors COLS' render fns but without HTML/badges/emoji,
// since Excel should get raw numbers/text, not markup meant for the on-screen table.
function exportVal(key,r){
  switch(key){
    case "set_name": return shortSet(r.set_name)||"";
    case "season": return r.season??"";
    case "name": return r.name||"";
    case "parallel": return r.parallel||"";
    case "card_number": return r.card_number||"";
    case "gr": return r.gr==null?"":Math.round(r.gr*100)+"%";
    case "gems": return num(r.gems)==null?"":num(r.gems);
    case "total": return num(r.total)==null?"":num(r.total);
    case "graded_past_month": return num(r.graded_past_month)==null?"":num(r.graded_past_month);
    case "graded_prior_month": return num(r.graded_prior_month)==null?"":num(r.graded_prior_month);
    case "raw": return r.raw==null?"":num(r.raw);
    case "maxbuy": return (r.maxbuy==null||r.maxbuy<=0)?"":Math.round(r.maxbuy*100)/100;
    case "p9": return r.p9==null?"":num(r.p9);
    case "p10": return r.p10==null?"":num(r.p10);
    case "priced_age": { const d=priceAgeDays(r); return d==null?"":d; }
    case "profit": return r.profit==null?"":num(r.profit);
    case "roi": return r.roi==null?"":Math.round(r.roi*100)+"%";
    case "d10": return r.d10==null?"":num(r.d10);
    case "d10mo": return r.d10mo==null?"":num(r.d10mo);
    case "volume": return num(r.volume)==null?"":num(r.volume);
    case "_status": { const p=[]; if(isFav(r)) p.push("Favorite"); if(isValue(r)) p.push("Value"); const t=trackOf(r); if(t){ if(t.qty) p.push("x"+t.qty); if(t.stage) p.push(stageLabel(t.stage)); } return p.join(" | "); }
    case "_inac": return isInac(r)?"Wrong":"";
    default: return "";
  }
}
// Exports exactly what's currently on screen: same filters, sort, and visible/hidden columns as
// the table — but every matching row, not just the 600-row render cap.
function exportDiscoveryCSV(){
  const rows=filtered();
  const statusRank=r=>(isValue(r)?4:0)+(isFav(r)?2:0)+(trackOf(r)?1:0);
  rows.sort((a,b)=>{
    let av,bv;
    if(sortKey==="_status"){ av=statusRank(a); bv=statusRank(b); } else { av=a[sortKey]; bv=b[sortKey]; }
    av=(av==null)?-Infinity:(typeof av==="string"?av.toLowerCase():av);
    bv=(bv==null)?-Infinity:(typeof bv==="string"?bv.toLowerCase():bv);
    if(av<bv) return -sortDir; if(av>bv) return sortDir; return 0;
  });
  const cols=ML.order.map(k=>COLS.find(c=>c[0]===k)).filter(c=>c && !ML.hidden[c[0]]);
  const lines=[cols.map(c=>csvEsc(c[1])).join(",")];
  rows.forEach(r=>lines.push(cols.map(c=>csvEsc(exportVal(c[0],r))).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});

const PCOLS="snapshot_date,season,game,set_name,card_number,name,parallel,lang,pc_console,pc_product,price_confidence,gems,total,gem_rate,gem_rate_month,graded_past_month,graded_prior_month,raw,psa9,psa10,mkt_raw,mkt_psa9,mkt_psa10,volume,source,raw_chg,psa9_chg,psa10_chg,prev_date,psa10_chg_mo,raw_chg_mo,prev_date_mo,price_updated_at,gem_rate_override";
async function seasonLatest(yr){ const d=await rest(`price_snapshots?season=eq.${yr}&select=snapshot_date&order=snapshot_date.desc&limit=1`); return d[0]&&d[0].snapshot_date; }
async function fetchSeason(yr,date){
  // PostgREST caps each response at 1000 rows regardless of &limit, so page through
  // ALL rows (stable order) — otherwise only the top-1000 by pop load and lower-pop
  // cards (incl. favorites) silently vanish from Discover.
  const out=[]; const step=1000; let from=0;
  // With "Hide unpriced" on (default) the table drops every row lacking raw+PSA9+PSA10 anyway (see `priced`/filtered()),
  // so don't download them at all. Matters since the 2026-10-04 GemRate imports took the catalog from ~49k to ~89k rows,
  // almost all unpriced -- fetching them made each year-load 2-4x slower for rows that were then thrown away.
  // Unchecking the box reloads with everything (slow, opt-in).
  const pricedOnly=st.hideUn?"&raw=not.is.null&psa9=not.is.null&psa10=not.is.null":"";
  for(;;){
    // Materialized (price_changes_mv), not the plain price_changes view -- confirmed live (2026-09-15)
    // via EXPLAIN ANALYZE the view recomputes its lag()/window pass over the ENTIRE season on every
    // single paginated page (season 2025's 66,836 rows took 3.1s per page and spilled to disk), and
    // that repeats for every page and every concurrently-fetched season, which is exactly what was
    // throwing "57014 statement timeout" here. The materialized copy (refreshed on a 10-min pg_cron
    // schedule -- see migration create_price_changes_materialized_view) turns this back into a plain
    // indexed lookup: same query dropped to 90ms in testing. A few minutes of staleness on the change-
    // tracking columns is a non-issue since raw_chg/psa9_chg/etc. are inherently week-over-week figures.
    const chunk=await rest(`price_changes_mv?season=eq.${yr}&snapshot_date=eq.${date}${pricedOnly}&select=${PCOLS}&order=set_name.asc,card_number.asc,parallel.asc&offset=${from}&limit=${step}`);
    out.push(...chunk);
    if(chunk.length<step) break;
    from+=step;
    if(from>100000) break;   // safety valve
  }
  return out;
}

async function ensureDates(yr){
  const dsel=document.getElementById("dateSel");
  const draw=await rest(`price_snapshots?season=eq.${yr}&select=snapshot_date&order=snapshot_date.desc&limit=100000`);
  const dates=[...new Set(draw.map(r=>r.snapshot_date))];
  dsel.innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join("");
  if(!dates.includes(st.date)) st.date=dates[0]||null;
  dsel.value=st.date; save();
}
// Shows immediately (before any network round-trip starts) so a slow load reads as "working" —
// previously the sub-header just kept showing the PREVIOUS load's summary text, unchanged, for as
// long as the new fetch took, which looked identical to the page being stuck.
function showLoadingHeader(){ const el=document.getElementById("sub"); if(el) el.innerHTML=`<span style="display:flex;align-items:center;gap:8px">${dfSpin(18)}Loading…</span>`; }
async function loadDate(){
  if(st.seasons.length!==1) return loadSeason();
  showLoadingHeader();
  const mySeq=++loadSeq;
  const data=await fetchSeason(st.seasons[0], st.date);
  if(mySeq!==loadSeq) return; // a newer load started while this one was in flight — discard
  RAW=data.map(enrich); buildGameChips(); buildSetOptions();
  document.getElementById("sub").textContent=`${RAW.length} cards · ${st.seasons[0]} · ${st.date||"—"}`;
  render();
}
async function loadSeason(){
  showLoadingHeader();
  const mySeq=++loadSeq;
  const dwrap=document.getElementById("dateSel").parentElement;
  const single=st.seasons.length===1;
  dwrap.style.display=single?"":"none";
  let all=[];
  if(single){
    const yr=st.seasons[0];
    await ensureDates(yr);
    if(mySeq!==loadSeq) return;
    if(st.date) all=await fetchSeason(yr, st.date);
  } else {
    // Fetch selected years with BOUNDED concurrency, not one giant Promise.all across every year at
    // once. The old unbounded version (2026-08-25, fixing a slow sequential for-await loop) traded one
    // real problem for another: confirmed live (2026-08-29), firing all ~44 selected years ("All years")
    // simultaneously overwhelmed the DB and started genuinely blowing the authenticated role's 8s
    // statement_timeout ("57014 canceling statement due to statement timeout") -- each year's query
    // hits price_changes, a VIEW built on a window function that has to recompute over its ENTIRE
    // season's rows before the snapshot_date filter can even apply (confirmed via EXPLAIN: ~300-700ms
    // PER PAGE even fully uncontended, since snapshot_date isn't one of the window's PARTITION BY
    // columns and so can't be pushed down ahead of it), so dozens of these landing on the DB at once is
    // real load, not free parallelism. A small pool keeps most of the original speed win (still far
    // faster than one-at-a-time) without saturating the DB the same way.
    const yrQueue=st.seasons.slice();
    const collected=[];
    const YEAR_POOL=5;
    async function yearWorker(){
      for(;;){
        const yr=yrQueue.shift();
        if(yr===undefined) return;
        const dt=await seasonLatest(yr);
        if(dt) collected.push(...(await fetchSeason(yr,dt)));
      }
    }
    await Promise.all(Array.from({length:Math.min(YEAR_POOL, st.seasons.length)}, yearWorker));
    all=collected;
  }
  if(mySeq!==loadSeq) return; // a newer load started while this one was in flight — discard
  RAW=all.map(enrich); buildGameChips(); buildSetOptions();
  const yearsLbl=st.seasons.length===0?"no years selected":st.seasons.length>1?("Years "+st.seasons.slice().sort().join(" + ")):st.seasons[0];
  document.getElementById("sub").textContent=`${RAW.length} cards · ${yearsLbl}`+(single&&st.date?` · ${st.date}`:"");
  render();
}

// Year chips used to be a hardcoded 2020-2026 list -- fine while every game was Pokemon/One Piece,
// but baseball cards go back to a player's rookie year (2018 for Ohtani, and other players/vintage
// sets can go back further), so any fixed range silently hides real, already-priced data with no
// way to even select it. Derive the actual min/max year straight from the data instead: two cheap
// order-by+limit-1 queries instead of scanning every row for distinct values.
let SEASON_LIST=null;
async function ensureSeasonList(){
  if(SEASON_LIST) return SEASON_LIST;
  try{
    const [hi,lo]=await Promise.all([
      rest(`price_snapshots?season=gt.0&select=season&order=season.desc&limit=1`),
      rest(`price_snapshots?season=gt.0&select=season&order=season.asc&limit=1`),
    ]);
    const maxY=hi[0]&&hi[0].season, minY=lo[0]&&lo[0].season;
    // Floor at 1990 even if nothing that old is in the catalog yet, so vintage-set imports (90s
    // basketball/baseball) have a year to select before any of their cards actually exist -- but
    // still extend further back automatically if real data ever predates that. Hard-clamped at 1984
    // no matter what minY reports -- confirmed live (2026-08-29) the true minY was 1964, from a single
    // junk row (a modern Ken Griffey Jr. HOF plaque postcard whose set_name literally starts "1964-DATE",
    // a running series' start year misread as this card's year -- both raw/psa9/psa10 null, no real
    // price data). Per the user: nothing before 1984 is wanted in Discover regardless of what any one
    // bad row's season value claims.
    if(maxY){ const floor=Math.max(1984,Math.min(minY||1990,1990)); const arr=[]; for(let y=maxY;y>=floor;y--) arr.push(y); SEASON_LIST=arr; }
  }catch(e){}
  if(!SEASON_LIST) SEASON_LIST=[2026,2025,2024,2023,2022,2021,2020];   // fallback if the probe queries fail
  return SEASON_LIST;
}
async function buildSeasonChips(){
  const wrap=document.getElementById("seasons");
  if(!wrap) return;
  if(!wrap.dataset.built){
    const years=await ensureSeasonList();
    const favBtn=document.getElementById("favBtnTop");
    years.forEach(y=>{
      const c=document.createElement("span"); c.className="chip"; c.dataset.season=String(y); c.textContent=y+" sets";
      wrap.insertBefore(c, favBtn);
    });
    wrap.dataset.built="1";
    // Toggle, not two separate buttons -- select all when anything is missing, clear to none when
    // everything's already selected. Clearing to none used to be impossible one chip at a time (the
    // last chip couldn't be removed), which made "I only want 2 of these 40 years" a chore of
    // unclicking everything else instead of clearing then picking the few you want.
    const allBtn=document.getElementById("allSeasonsBtn");
    if(allBtn) allBtn.onclick=async()=>{ const years=(await ensureSeasonList()).map(String);
      st.seasons=(st.seasons.length>=years.length)?[]:years.slice();
      st.set="__all"; save(); buildSeasonChips();
      try{ await loadSeason(); }catch(e){ document.getElementById("sub").innerHTML=`<span class="err">${e.message}</span>`; } };
  }
  const allBtn2=document.getElementById("allSeasonsBtn");
  if(allBtn2){ const years=await ensureSeasonList(); const allOn=st.seasons.length>=years.length;
    allBtn2.textContent=allOn?"☐ Clear years":"☑ All years";
    allBtn2.title=allOn?"Deselect every year at once":"Select every year at once"; }
  document.querySelectorAll("#seasons .chip").forEach(c=>{
    c.classList.toggle("on", st.seasons.includes(c.dataset.season));
    c.onclick=async()=>{ const y=c.dataset.season;
      if(st.seasons.includes(y)) st.seasons=st.seasons.filter(x=>x!==y);
      else st.seasons.push(y);
      st.set="__all"; save(); buildSeasonChips();
      try{ await loadSeason(); }catch(e){ document.getElementById("sub").innerHTML=`<span class="err">${e.message}</span>`; } };
  });
}

// ---- eBay + card sidebar ----
// Deal Feed's "🔎 Sales" button wants a broad, sold-comps search across every parallel of a card
// (not the narrow name+parallel+# search the research sidebar uses) -- just the core Pokemon name,
// the card number, and "psa", e.g. "Full Art/Rayquaza Vmax" #111 -> "Rayquaza 111 psa", not
// "Full Art/Rayquaza Vmax Base 111". Strips the "Full Art/"-style prefix and generic suffix words
// (Vmax/V/GX/EX/etc) the same way the backend's nameKey() STOP list does, since those narrow the
// search to one specific parallel instead of showing the full range of what this card sells for.
const DF_SALES_STOP = new Set(["ex","gx","vmax","vstar","v","full","art","rare","holo","reverse","alt","alternate","promo","secret","special","illustration"]);
function dfSalesName(name){
  let n = String(name||""); const i = n.lastIndexOf("/"); if(i>=0) n = n.slice(i+1);
  const words = n.split(/\s+/).filter(Boolean).filter(w=>!DF_SALES_STOP.has(w.toLowerCase()));
  return (words.join(" ").trim()) || n.trim();
}
function dfSalesUrl(it){
  const q=[dfSalesName(it.name), String(it.card_number||"").trim(), "psa"].filter(Boolean).join(" ");
  return "https://www.ebay.com/sch/i.html?_nkw="+encodeURIComponent(q)+"&_sacat=0&LH_Sold=1&LH_Complete=1";
}
function ebayUrl(r, mode){
  const bits=[r.name, r.parallel, r.card_number].filter(Boolean).join(" ");
  let kw=bits;
  if(mode==="psa10") kw+=" PSA 10";
  else if(mode==="psa9") kw+=" PSA 9";
  else if(mode==="raw") kw+=" -PSA -BGS -CGC";
  let u="https://www.ebay.com/sch/i.html?_nkw="+encodeURIComponent(kw)+"&_sacat=0";
  if(mode!=="active") u+="&LH_Sold=1&LH_Complete=1";
  return u;
}

async function fillPdTag(r, elId){

// Downscales/compresses a local image file client-side (max 600px wide, JPEG ~82%) before handing it
// to setCardImage as a data: URL -- avoids needing any storage-bucket backend work since card-image's
// "set" action already just stores whatever string it's given as image_url, no format validation.
function readImageFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Couldn't read that file."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Couldn't load that image file."));
      img.onload=()=>{
        const maxW=600, scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale)||1, h=Math.round(img.height*scale)||1;
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.82));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  if(/^https?:\/\//i.test(uri)){ setCardImage(r, uri); return; }

// drag-to-resize table columns (adds a grab handle to each header cell)
function makeResizable(table,onResize,fit,_t){
  if(!table) return;
  if(table.offsetParent===null || table.offsetWidth===0){ if((_t||0)<20) requestAnimationFrame(()=>makeResizable(table,onResize,fit,(_t||0)+1)); return; }   // retry until laid out
  // render() rebuilds <thead> from scratch on every call (filter/sort/column change all do this), so
  // the <th> elements here are always fresh -- a "run once per table" guard would skip re-attaching
  // handles to every render after the first, silently breaking resize the moment anything re-rendered.
  if(!document.getElementById("colresize-css")){
    const s=document.createElement("style"); s.id="colresize-css";
    s.textContent=".colresize{position:absolute;top:0;right:0;width:12px;height:100%;cursor:col-resize;user-select:none;z-index:2}.colresize::after{content:\"\";position:absolute;top:15%;right:5px;width:2px;height:70%;background:rgba(90,110,255,.35);border-radius:1px}.colresize:hover::after,.colresize:active::after{background:#5566ff}.colresize:hover{background:rgba(90,110,255,.12)}";
    document.head.appendChild(s);
  }
  table._onResize=onResize; table._fit=fit;
  const ths=[...table.querySelectorAll("thead th")];
  // prefer a saved/explicit column width over the measured (content-expanded) width, so narrow widths persist
  const widths=ths.map(th=>{ const w=parseFloat(th.style.width); return (w&&isFinite(w))?w:th.offsetWidth; });
  const sum=widths.reduce((a,b)=>a+b,0);
  // fit=true (Discover's #tbl only -- see its call site): scale every column proportionally so they
  // always sum to exactly the wrap's own width, instead of sizing the table to the raw sum of column
  // widths and letting .tablewrap's overflow:auto put up a horizontal scrollbar whenever that sum runs
  // past what's on screen. Scaling (not just clamping) keeps each column's width relative to the others,
  // so a saved/dragged width still means roughly the same thing, it just always adds up to what's
  // actually available. Other tables (Purchased/Deal Feed/Accounting) don't pass `fit` and keep the
  // original scroll-if-needed behavior -- those have fixed-width inputs inside cells that shouldn't shrink.
  const avail = fit && table.parentElement ? table.parentElement.clientWidth : 0;
  const MIN_W=34;
  const useWidths = (avail>MIN_W && sum>0) ? widths.map(w=>Math.max(MIN_W, w*avail/sum)) : widths;
  table.style.tableLayout="fixed";
  table.style.width=(avail>MIN_W ? avail : sum)+"px";
  ths.forEach((th,i)=>{
    th.style.width=useWidths[i]+"px"; if(getComputedStyle(th).position==="static") th.style.position="relative";
    const h=document.createElement("div"); h.className="colresize"; th.appendChild(h);
    let sx,sw;
    const mm=ev=>{ th.style.width=Math.max(40,sw+(ev.pageX-sx))+"px"; };
    const mu=()=>{ document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); document.body.style.cursor=""; setTimeout(()=>{ th.draggable=true; },0); if(onResize&&th.dataset.key) onResize(th.dataset.key, th.offsetWidth); };
    h.addEventListener("mousedown",e=>{ sx=e.pageX; sw=th.offsetWidth; th.draggable=false; document.body.style.cursor="col-resize"; e.preventDefault(); e.stopPropagation(); document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu); });
    h.addEventListener("click",e=>e.stopPropagation());
  });
  // Re-fit on window resize -- render() only reruns makeResizable when a filter/sort/column change
  // triggers it, so without this, shrinking the browser window would leave the table sized for the
  // old, wider viewport and bring the scrollbar right back.
  if(!window.__tblFitResizeBound){
    window.__tblFitResizeBound=true;
    let rt=null;
    window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
      document.querySelectorAll(".tablewrap table").forEach(t=>{ if(t._fit && t.isConnected) makeResizable(t,t._onResize,true); });
    },150); });
  }
}

// Float a .pcmenu popover with fixed positioning so it isn't clipped by scrollable
// containers (e.g. #dfbody / #bbody). Anchors the menu's top-right to the button.
function floatMenuOpen(btn,menu){
  menu.style.display="block";
  menu.style.position="fixed";
  menu.style.left="auto";
  const vw=window.innerWidth, pad=6, avail=vw-pad*2;
  // A wide menu (e.g. the 330px card picker) on a narrow screen would otherwise run off the
  // LEFT edge, because we only anchor the right edge. Cap the width first — min-width beats
  // max-width in CSS, so the min has to come down too — then clamp the position.
  const cs=getComputedStyle(menu);
  const mw=parseFloat(cs.minWidth)||0;
  if(mw>avail) menu.style.minWidth=avail+"px";
  menu.style.maxWidth=avail+"px";
  const r=btn.getBoundingClientRect();
  menu.style.top=(r.bottom+4)+"px";
  menu.style.right=Math.max(pad,(vw-r.right))+"px";
  menu.style.maxHeight=(window.innerHeight-r.bottom-16)+"px";
  menu.style.overflowY="auto";
  const m=menu.getBoundingClientRect();
  if(m.left<pad) menu.style.right=Math.max(pad,vw-pad-m.width)+"px";   // pull back inside the viewport
}
function floatMenuClose(menu){
  menu.style.display="none"; menu.style.position=""; menu.style.top=""; menu.style.right="";
  menu.style.left=""; menu.style.maxHeight=""; menu.style.overflowY="";
}

function findCard(term){
  term=(term||"").trim().toLowerCase(); if(!term) return null;
  let c=RAW.find(x=>((x.name+" "+(x.parallel||"")+" #"+x.card_number).toLowerCase())===term);
  if(c) return c;
  const toks=term.split(/[\s|]+/).filter(Boolean);
  const cands=RAW.filter(x=>{const s=(x.name+" "+(x.parallel||"")+" "+x.card_number).toLowerCase(); return toks.every(t=>s.includes(t));});
  return cands.length?cands[0]:null;
}
async function addPurchase(card, price, date, qty, itemId){
  const title=`${card.name} ${card.parallel||""} #${card.card_number} (manual)`.replace(/\s+/g," ").trim();
  const {error}=await sb.from("card_transactions").insert({user_id:SESSION.user.id,type:"buy",txn_date:date||null,
    price:(price!=null&&price!=="")?+price:null,item_title:title,ebay_order_id:null,email_id:null,
    ebay_item_id:(itemId||"").replace(/[^0-9]/g,"")||null,
    game:card.game,set_name:card.set_name,card_number:card.card_number,parallel:card.parallel,matched:true,confidence:"manual"});
  if(error) throw new Error(error.message);
  const k=keyOf(card); const t=TRACK[k]||{qty:0,stage:""}; t.qty=(t.qty||0)+(+qty||1); t.stage="purchased"; TRACK[k]=t; saveTrack();
  await syncCard(card);
}
async function addSingle(){
  const st=document.getElementById("astatus");
  const card=findCard(document.getElementById("acard").value);
  if(!card){ st.innerHTML='<span class="err">No matching card in the current season — switch season or refine.</span>'; return; }
  try{
    await addPurchase(card, document.getElementById("aprice").value, document.getElementById("adate").value, document.getElementById("aqty").value, (document.getElementById("aitem")||{}).value);
    document.getElementById("acard").value=""; document.getElementById("aprice").value="";
    st.innerHTML='<span class="pos">Added '+card.name+'.</span>';
    openPurchases();
  }catch(e){ st.innerHTML='<span class="err">'+e.message+'</span>'; }
}
async function addBulk(){
  const st=document.getElementById("astatus");
  const lines=document.getElementById("abulktext").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let ok=0; const bad=[];
  for(const line of lines){
    const p=line.split("|").map(s=>s.trim());
    const card=findCard(p[0]);
    if(!card){ bad.push(p[0]); continue; }
    try{ await addPurchase(card, p[1], p[2], 1); ok++; }catch(e){ bad.push(p[0]); }
  }
  st.innerHTML=`<span class="pos">Added ${ok}.</span>`+(bad.length?` <span class="err">No match: ${bad.join("; ")}</span>`:"");
  if(ok) openPurchases();
}

function gradeMarginAt(r,fee){
  const gem=num(r.gem_rate), p9=num(r.psa9), p10=num(r.psa10), raw=num(r.raw);
  if(gem==null||p9==null||p10==null||raw==null) return null;
  return 0.88*(gem*p10+(1-gem)*p9) - fee - 0.88*raw;   // gem-weighted graded value (after fees) − grading − raw sale given up
}
function gradeBreakdown(r){

  const line=(l,v,bold)=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:3px 0;${bold?'font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px':''}"><span>${l}</span><span>${v}</span></div>`;

// costOverride: for "Ending soon" auctions specifically, the LIVE current bid is a bad stand-in for

// card's own average raw comp instead of it.price for these, so the shown profit/ROI reflects what a
// closing bid near fair market value would look like, not a misleadingly-huge number that will
// evaporate by the time the auction actually ends.
// Missing gem_rate defaults to 0.5 rather than blanking the estimate -- confirmed live (2026-09-12):
// a manually-priced "Double Check" card (raw/psa9/psa10 set by hand, no PSA population data on file

async function openDealFeed(){
  const body=document.getElementById("dfbody");
  if(!sb||!SESSION){ body.innerHTML='<p class="note">Sign in (top-right) to see the deal feed.</p>'; return; }
  body.innerHTML=`<p class="note" style="display:flex;align-items:center;gap:8px">${dfSpin(28)}Loading deals…</p>`;
  try{
    // PostgREST caps each response at 1000 rows; page through so auctions (older first_seen) aren't cut off
    LB=[]; let _from=0;
    for(;;){
      const {data,error}=await sb.rpc("lets_buy_listings").range(_from,_from+999);
      if(error){ body.innerHTML='<p class="err">'+error.message+'</p>'; return; }
      const chunk=data||[]; LB=LB.concat(chunk);
      if(chunk.length<1000) break;
      _from+=1000; if(_from>30000) break;
    }
    await loadBlocked(); LB=LB.filter(it=>!isBlockedSeller(it.seller_username));   // hide blocked sellers
    LB.forEach(it=>{ it.item_price=+it.price||0; const es=effShip(it); it.ship_cost=es.cost; it.ship_est=es.est; it.price=it.item_price+(es.cost||0); });
    const lowRev=LB.filter(it=>it.seller_feedback_score!=null && Number(it.seller_feedback_score)<8);
    if(lowRev.length){ try{ await sb.from("listing_dismissals").insert(lowRev.map(it=>({user_id:SESSION.user.id,item_id:it.item_id}))); }catch(e){} const ids=new Set(lowRev.map(it=>it.item_id)); LB=LB.filter(it=>!ids.has(it.item_id)); }
    renderDealFeed();
    loadWatchlist().then(()=>{ if(document.getElementById("dfbody")) renderDealFeed(); });   // repaint Watch buttons from real eBay watch list
    loadFavRank().then(()=>{ if(document.getElementById("dfbody")) renderDealFeed(); });   // repaint ROI-rank badges once ranked
    loadFavGames().then(()=>{ if(document.getElementById("dfbody")) renderDealFeed(); });   // repaint Game toggles once sparse-inventory games are known
  }catch(e){ body.innerHTML='<p class="err">'+e.message+'</p>'; }
}
function renderDealFeed(){
  const body=document.getElementById("dfbody");
  // Reset the render window whenever the filter set changes; otherwise keep however many the user has scrolled to.
  const sig=JSON.stringify([DEALFEED.sort,DEALFEED.win,DEALFEED.type,DEALFEED.maxOverRaw,DEALFEED.minOverRaw,DEALFEED.minRaw,DEALFEED.minRoi,DEALFEED.minListedH,DEALFEED.maxListedH,DEALFEED.size,DEALFEED.cond,DEALFEED.cards,DEALFEED.games,DF_Q,LB.length]);
  if(sig!==DF_SIG){ DF_SIG=sig; DF_LIMIT=DF_PAGE; }
  let dfTotal=0;   // total cards that match (before the render cap) — drives the "load more" sentinel
  const winMax=Math.min(120,DEALFEED.win);   // up to 5 days (120h)
  const endMs=it=>{ const e=it.end_date?new Date(it.end_date).getTime():NaN; return isNaN(e)?null:e; };
  const colMin=DF_SIZES[DEALFEED.size]||150;
  const grid=arr=>`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${colMin}px,1fr));gap:12px;margin:6px 0 16px">${arr.map(dfCard).join("")}</div>`;
  const endMode=DEALFEED.sort==='ending';
  const ageMode=DEALFEED.sort==='recent';
  // ---- one filter pass for every sort mode -----------------------------------------------------
  // "Ending soon" implies auctions and ignores the listing-age window (an auction listed days ago but
  // closing in an hour is exactly what we want). Every other sort honours the window + BIN/Auction type.
  let items=LB.filter(it=>{
    const p=num(it.price);
    if(p==null) return false;
    if(!dfGameMatch(it)) return false;
    if(!dfCardMatch(it)) return false;
    if(!dfOverRawOk(it)) return false;
    if(!dfMinRawOk(it)) return false;
    if(!dfMinRoiOk(it)) return false;
    if(!dfListedHoursOk(it)) return false;
    if(!dfSearchOk(it)) return false;
    if(endMode){ if(!(it.buying_options||"").includes("AUCTION")) return false; }
    else { if(ageHours(it)>winMax) return false; if(!dfTypeMatch(it)) return false; }
    if(DEALFEED.cond && DEALFEED.cond.length<DF_CONDS.length && !dfCondOk(it)) return false;
    return true;
  });
  const prof=it=>{ const v=lbEstProfit(it); return v==null?-1e9:v; };
  const under=it=>{ const v=dfPctUnderRaw(it); return v==null?-1e9:v; };
  const roi=it=>{ const v=dfRoi(it); return v==null?-1e9:v; };
  if(endMode){
    const now=Date.now();
    const endK=it=>{ const e=endMs(it); return (e!=null&&e>now)?e:Infinity; };
    items.sort((a,b)=>{ const ea=endK(a), eb=endK(b); if(ea!==eb) return ea-eb; return prof(b)-prof(a); });
  } else if(DEALFEED.sort==='deal'){
    items.sort((a,b)=>under(b)-under(a)||prof(b)-prof(a));
  } else if(DEALFEED.sort==='profit'){
    items.sort((a,b)=>prof(b)-prof(a)||under(b)-under(a));
  } else if(DEALFEED.sort==='roi'){
    items.sort((a,b)=>roi(b)-roi(a)||prof(b)-prof(a));
  } else {
    items.sort((a,b)=>(b.first_seen>a.first_seen?1:b.first_seen<a.first_seen?-1:0));
  }
  dfTotal=items.length;
  const shown=items.slice(0,DF_LIMIT);
  if(shown.length) dfFetchConditions(shown);   // warm condition badges only for what's on screen
  let sections="";
  if(ageMode){
    const secs=[["⏱ Last hour",0,1],["⏱ 1–6 hours ago",1,6],["⏱ 6–12 hours ago",6,12],["⏱ 12–24 hours ago",12,24],["⏱ 1–5 days ago",24,120]].filter(s=>s[1]<=winMax);
    for(const [lbl,lo,hi] of secs){
      const arr=shown.filter(it=>{ const a=ageHours(it); return a>lo && a<=hi; });
      if(!arr.length) continue;
      sections+=`<div style="font-size:13px;font-weight:700;margin:6px 2px 2px;color:var(--muted)">${lbl} <span class="muted" style="font-weight:500">· ${arr.length}</span></div>`+grid(arr);
    }
  } else if(shown.length) sections=grid(shown);
  if(!sections) sections=`<p class="note" style="padding:16px 2px">No listings match. ${DEALFEED.cards.length?'Try clearing the card filter, or ':''}widen the filters or refresh.</p>`;
  const seg=(cls,cur,opts)=>`<div class="seg ${cls}">`+opts.map(([v,l])=>`<button data-val="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join("")+`</div>`;
  const nActive=dfActiveCount(), nCards=DEALFEED.cards.length;
  // --- compact bar: card picker · sort · filters (badge) · icons ---------------------------------
  const cardBtn=`<div class="pcolwrap"><button class="pbtn" id="dfCardBtn" title="Show only specific cards" style="${nCards?'background:#1c5a99;color:#fff;border-color:#1c5a99':''}">🃏 ${nCards?`${nCards} card${nCards>1?'s':''}`:'All cards'} ▾</button><div class="pcmenu" id="dfCardMenu" style="display:none;min-width:330px"></div></div>`;
  const sortBtn=`<div class="pcolwrap"><button class="pbtn" id="dfSortBtn" title="Sort the feed">${dfSortLabel()} ▾</button><div class="pcmenu" id="dfSortMenu" style="display:none;min-width:250px"></div></div>`;
  // filtBtn is assembled after the panel rows below (it wraps them as a dropdown menu)
  const iconRow=`<div class="dfrow" style="margin-left:auto">`
    +`<div class="pcolwrap"><button class="pbtn iconbtn" id="dfAlertBtn" title="Notification rules">🔔</button><div class="pcmenu" id="dfAlertMenu" style="display:none;min-width:252px"></div></div>`
    +`<div class="pcolwrap"><button class="pbtn iconbtn" id="dfSizeBtn" title="Image size">🖼</button><div class="pcmenu" id="dfSizeMenu" style="display:none"></div></div>`
    +`<a class="pbtn iconbtn" href="https://www.gixen.com/main/home_2.php" target="_blank" rel="noopener" title="Open Gixen sniping" style="text-decoration:none">🎯</a>`
    +`<div class="pcolwrap"><button class="pbtn iconbtn" id="dfBlockBtn" title="Blocked sellers">🚫</button><div class="pcmenu" id="dfBlockMenu" style="display:none;min-width:250px"></div></div>`
    +`<button class="pbtn iconbtn" id="dfRefresh" title="Refresh">🔄</button></div>`;
  // --- filters dropdown (same menu pattern as the card + sort dropdowns beside it) ---------------
  const condLbl={NM:"NM",LP:"LP",MP:"MP",HP:"HP","?":"?"};
  const condSeg=DF_CONDS.map(v=>`<button class="dfcond" data-c="${v}" title="${v==='?'?'unknown / not yet fetched':'eBay card condition '+v}" style="border:1px solid ${DEALFEED.cond.includes(v)?'#1a2233':'var(--line)'};border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;background:${DEALFEED.cond.includes(v)?'#1a2233':'#fff'};color:${DEALFEED.cond.includes(v)?'#fff':'var(--muted)'}">${condLbl[v]}</button>`).join("");
  // stacked rows read better inside a narrow dropdown than the old side-by-side panel layout
  const fRow=(lbl,ctl,hint)=>`<div style="padding:9px 2px;border-top:1px solid var(--line)"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px">${lbl}</div><div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">${ctl}</div>${hint?`<div class="muted" style="font-size:10px;margin-top:4px">${hint}</div>`:''}</div>`;
  const gameSeg=dfGameGroups().map(g=>{ const on=DEALFEED.games.includes(g.game); return `<button class="dfgame" data-g="${escH(g.game)}" title="${on?'Hide':'Show'} ${escH(dfGameLabel(g.game))}" style="border:1px solid ${on?'#1a2233':'var(--line)'};border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;background:${on?'#1a2233':'#fff'};color:${on?'#fff':'var(--muted)'}">${escH(dfGameLabel(g.game))} <span style="opacity:.7">${g.n}</span></button>`; }).join("");
  const filtMenu=`<div class="pcmenu" id="dfFiltMenu" style="display:none;min-width:290px">`
    +`<div class="pchint">Filters${nActive?` — ${nActive} active`:''}</div>`
    +(endMode?`<div class="muted" style="font-size:10px;padding:0 2px 6px">“Ending soon” shows auctions only and ignores the listing-age window, so those two controls are hidden.</div>`:"")
    +(gameSeg?fRow("Game", gameSeg, DEALFEED.games.length?"":"none selected = all games"):"")
    +(endMode?"":fRow("Listed within", seg("dftime", DEALFEED.win, [[1,"1h"],[6,"6h"],[12,"12h"],[120,"5d"]])))
    +(endMode?"":fRow("Buy type", seg("dftype2", DEALFEED.type, [["both","Both"],["bin","BIN"],["auc","Auction"]])))
    +fRow("Condition", condSeg, "eBay-listed card condition")
    +fRow("% over raw", `<input id="dfMinOverRaw" type="number" step="10" value="${DEALFEED.minOverRaw==null?'':DEALFEED.minOverRaw}" placeholder="any" style="width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:6px"><span class="muted" style="font-size:12px">to</span><input id="dfMaxRaw" type="number" step="10" value="${DEALFEED.maxOverRaw==null?'':DEALFEED.maxOverRaw}" placeholder="any" style="width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:6px"><span class="muted" style="font-size:12px">%</span>`, "Negative = below raw, e.g. -20 to 20 shows listings from 20% under raw to 20% over")
    +fRow("Min raw price", `<span class="muted" style="font-size:12px">$</span><input id="dfMinRaw" type="number" step="10" value="${DEALFEED.minRaw==null?'':DEALFEED.minRaw}" placeholder="any" style="width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px">`, "Only show cards whose market raw price is at least this much")
    +fRow("Min ROI %", `<input id="dfMinRoi" type="number" step="5" value="${DEALFEED.minRoi==null?'':DEALFEED.minRoi}" placeholder="any" style="width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px"><span class="muted" style="font-size:12px">%</span>`, endMode?"Uses this card's average raw comp as the cost while sorted by Ending soon, not the current bid — see the ⓘ on any card's est. profit for why":"Return on cost: est. grading profit ÷ (price + grading fee)")
    +fRow("Hours on eBay", `<input id="dfMinListedH" type="number" step="1" min="0" value="${DEALFEED.minListedH==null?'':DEALFEED.minListedH}" placeholder="any" style="width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px"><span class="muted" style="font-size:12px">to</span><input id="dfMaxListedH" type="number" step="1" min="0" value="${DEALFEED.maxListedH==null?'':DEALFEED.maxListedH}" placeholder="any" style="width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px"><span class="muted" style="font-size:12px">hrs</span>`, "How long the listing itself has been up on eBay (not when Volt found it) — set a max to hide stale listings that have likely already been picked over. 168 = 1 week, 720 = 1 month")
    +fRow("Scroll to zoom", `<button class="pbtn" id="dfZoomToggle" style="${DEALFEED.zoom?'background:#1a2233;color:#fff;border-color:#1a2233':''}">🔍 ${DEALFEED.zoom?'On':'Off'}</button>`, "Scroll wheel over a card image to zoom &amp; pan")
    +`<div style="display:flex;gap:6px;margin-top:9px"><button class="pbtn" id="dfClearFilt" style="flex:1">Clear all</button><button class="pbtn" id="dfFiltDone" style="flex:1">Done</button></div>`
    +`</div>`;
  const filtBtn=`<div class="pcolwrap"><button class="pbtn" id="dfFiltBtn" title="Filters" style="${nActive?'background:#1a2233;color:#fff;border-color:#1a2233':''}">⚙ Filters${nActive?` (${nActive})`:''} ▾</button>${filtMenu}</div>`;
  // --- active filter chips ----------------------------------------------------------------------
  const chips=[];
  if(DEALFEED.games.length) chips.push([DEALFEED.games.map(dfGameLabel).join(" + "),"games"]);
  if(nCards) chips.push([`🃏 ${nCards} card${nCards>1?'s':''}`,"cards"]);
  if(!endMode && DEALFEED.win!==120) chips.push([`⏱ ${DEALFEED.win}h`,"win"]);
  if(!endMode && DEALFEED.type!=="both") chips.push([DEALFEED.type==="bin"?"BIN only":"Auctions only","type"]);
  if(DEALFEED.maxOverRaw!=null || DEALFEED.minOverRaw!=null){
    const lo=DEALFEED.minOverRaw, hi=DEALFEED.maxOverRaw;
    const lbl=(lo!=null&&hi!=null)?`${lo}% to ${hi}% over raw`:(lo!=null?`≥ ${lo}% over raw`:`≤ ${hi}% over raw`);
    chips.push([lbl,"overraw"]);
  }
  if(DEALFEED.minRaw!=null) chips.push([`Raw ≥ ${money2(DEALFEED.minRaw)}`,"minraw"]);
  if(DEALFEED.minRoi!=null) chips.push([`ROI ≥ ${DEALFEED.minRoi}%`,"minroi"]);
  if(DEALFEED.minListedH!=null || DEALFEED.maxListedH!=null){
    const lo=DEALFEED.minListedH, hi=DEALFEED.maxListedH;
    const lbl=(lo!=null&&hi!=null)?`${lo}–${hi}h on eBay`:(lo!=null?`≥ ${lo}h on eBay`:`≤ ${hi}h on eBay`);
    chips.push([lbl,"listedh"]);
  }
  if(DEALFEED.cond && DEALFEED.cond.length<DF_CONDS.length) chips.push([`Cond: ${DEALFEED.cond.join("/")||"none"}`,"cond"]);
  const chipRow=chips.length?`<div class="dfrow" style="gap:6px;flex-wrap:wrap;margin-top:6px">`+chips.map(([l,k])=>`<button class="dfchip" data-k="${k}" title="Remove this filter" style="border:1px solid var(--line);background:#eef3ff;color:#1c5a99;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer">${l} ✕</button>`).join("")+`<button class="dfchip" data-k="all" style="border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline">Clear all</button></div>`:"";
  const searchBar=`<input type="text" id="dfSearch" placeholder="🔍 Search what's in the feed — name / set / parallel / #, -word to exclude" value="${escH(DF_Q)}" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #d6d9e6;border-radius:9px;box-sizing:border-box;margin-bottom:6px">`;
  // The Game filter is an INCLUDE list (pick games to keep), so favoriting a game that wasn't in it when you set it up -- e.g.
  // soccer/football after "Basketball + Baseball + Hockey" -- silently hides every listing for it. Say how many are hidden and
  // offer a one-click fix. (Confirmed 2026-10-07: 127 live Yamal + 48 Messi listings were all hidden by exactly this.)
  let hiddenGameNote="";
  if(DEALFEED.games.length){
    const hid={}; for(const it of LB){ const g=it.game||""; if(!DEALFEED.games.includes(g)) hid[g]=(hid[g]||0)+1; }
    const ks=Object.keys(hid);
    if(ks.length){ const tot=ks.reduce((a,k)=>a+hid[k],0);
      hiddenGameNote=` <button id="dfShowHiddenGames" title="Add these games to your Game filter" style="border:1px solid #f0d9a8;background:#fff8e6;color:#8a5a00;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer">🙈 ${tot} hidden by your Game filter (${ks.map(k=>dfGameLabel(k)+" "+hid[k]).join(", ")}) — show them</button>`; }
  }
  const noteTxt=`Showing <b>${dfTotal}</b> live raw listing${dfTotal===1?'':'s'} for your ⭐ favorites · ${dfSortLabel()}.${hiddenGameNote}`;
  // Count sits right beside the Filters button (not in a line below the chips) so it stays visible
  // while the Filters dropdown is open and you can watch it change as you adjust filters.
  const tools=`<div class="dfbar">${searchBar}<div class="dfrow">${cardBtn}${sortBtn}${filtBtn}<span class="muted" style="font-size:12px;align-self:center">${noteTxt}</span>${iconRow}</div>${chipRow}</div>`;
  const hasMore=dfTotal>DF_LIMIT;
  const moreHtml=hasMore?`<div id="dfMore" style="grid-column:1/-1;padding:14px 2px;text-align:center;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px">${dfSpin(20)}<span>Loading more… <span class="muted">(${DF_LIMIT} of ${dfTotal})</span></span></div>`:(dfTotal>DF_PAGE?`<div style="padding:12px 2px;text-align:center;color:var(--muted);font-size:12px">All ${dfTotal} shown</div>`:"");
  body.innerHTML=tools+`<div style="margin:0 2px 8px"></div>`+sections+moreHtml;
  body.querySelectorAll(".dftime button").forEach(b=>b.onclick=()=>{ DEALFEED.win=+b.dataset.val; saveDealFeed(); renderDealFeed(); });
  body.querySelectorAll(".dftype2 button").forEach(b=>b.onclick=()=>{ DEALFEED.type=b.dataset.val; saveDealFeed(); renderDealFeed(); });
  // card picker
  const cb=document.getElementById("dfCardBtn"), cm=document.getElementById("dfCardMenu");
  if(cb) cb.onclick=()=>{ const show=cm.style.display==="none";
    if(show){ DF_CARDQ=""; DF_CARDOPEN=true; renderCardPicker(cm); floatMenuOpen(cb,cm); const qi=cm.querySelector("#dfCardQ"); if(qi) qi.focus(); }
    else { DF_CARDOPEN=false; floatMenuClose(cm); } };
  if(DF_CARDOPEN && cb && cm){ renderCardPicker(cm); floatMenuOpen(cb,cm); }   // survive the re-render
  // sort menu
  const sb2=document.getElementById("dfSortBtn"), sm2=document.getElementById("dfSortMenu");
  if(sb2) sb2.onclick=()=>{ const show=sm2.style.display==="none";
    if(show){ sm2.innerHTML='<div class="pchint">Sort the feed</div>'+DF_SORTS.map(([v,l,h])=>`<div class="pcitem dfsortopt" data-val="${v}" style="cursor:pointer;${DEALFEED.sort===v?'background:#eef3ff;font-weight:800':''}"><span>${l}<br><span class="muted" style="font-size:10px;font-weight:500">${h}</span></span></div>`).join("");
      sm2.querySelectorAll(".dfsortopt").forEach(x=>x.onclick=()=>{ DEALFEED.sort=x.dataset.val; saveDealFeed(); floatMenuClose(sm2); renderDealFeed(); });
      floatMenuOpen(sb2,sm2); } else floatMenuClose(sm2); };
  // filters panel toggle + chips
  const fb=document.getElementById("dfFiltBtn"), fm=document.getElementById("dfFiltMenu");
  if(fb&&fm) fb.onclick=()=>{ const show=fm.style.display==="none"; if(show){ DF_PANEL=true; floatMenuOpen(fb,fm); } else { DF_PANEL=false; floatMenuClose(fm); } };
  if(DF_PANEL&&fb&&fm) floatMenuOpen(fb,fm);   // stay open across the re-render a filter change triggers
  const fd=document.getElementById("dfFiltDone"); if(fd) fd.onclick=()=>{ DF_PANEL=false; floatMenuClose(fm); };
  const zt=document.getElementById("dfZoomToggle"); if(zt) zt.onclick=()=>{ DEALFEED.zoom=!DEALFEED.zoom; saveDealFeed(); renderDealFeed(); };
  const cf=document.getElementById("dfClearFilt"); if(cf) cf.onclick=()=>dfClearFilters();
  body.querySelectorAll(".dfchip").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="games") DEALFEED.games=[];
    else if(k==="cards") DEALFEED.cards=[];
    else if(k==="win") DEALFEED.win=120;
    else if(k==="type") DEALFEED.type="both";
    else if(k==="overraw"){ DEALFEED.maxOverRaw=null; DEALFEED.minOverRaw=null; }
    else if(k==="minraw") DEALFEED.minRaw=null;
    else if(k==="minroi") DEALFEED.minRoi=null;
    else if(k==="listedh"){ DEALFEED.minListedH=null; DEALFEED.maxListedH=null; }
    else if(k==="cond") DEALFEED.cond=DF_CONDS.slice();
    else if(k==="all"){ DEALFEED.cards=[]; dfClearFilters(); return; }   // dfClearFilters also resets games

    saveDealFeed(); renderDealFeed();
  });
  const mr=document.getElementById("dfMaxRaw"); if(mr) mr.onchange=()=>{ const v=mr.value.trim(); DEALFEED.maxOverRaw=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const mnr=document.getElementById("dfMinOverRaw"); if(mnr) mnr.onchange=()=>{ const v=mnr.value.trim(); DEALFEED.minOverRaw=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const nr=document.getElementById("dfMinRaw"); if(nr) nr.onchange=()=>{ const v=nr.value.trim(); DEALFEED.minRaw=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const mroi=document.getElementById("dfMinRoi"); if(mroi) mroi.onchange=()=>{ const v=mroi.value.trim(); DEALFEED.minRoi=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const mind=document.getElementById("dfMinListedH"); if(mind) mind.onchange=()=>{ const v=mind.value.trim(); DEALFEED.minListedH=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const maxd=document.getElementById("dfMaxListedH"); if(maxd) maxd.onchange=()=>{ const v=maxd.value.trim(); DEALFEED.maxListedH=(v===""?null:(isFinite(+v)?+v:null)); saveDealFeed(); renderDealFeed(); };
  const dfs=document.getElementById("dfSearch"); if(dfs) dfs.oninput=()=>{ DF_Q=dfs.value; const at=dfs.selectionStart; renderDealFeed(); const n=document.getElementById("dfSearch"); if(n){ n.focus(); try{n.setSelectionRange(at,at);}catch(e){} } };

function arRuleSummary(r){

  const parts=[];
  const rp=[seg(r.raw_min_usd,r.raw_max_usd,"$",""),seg(r.raw_min_pct,r.raw_max_pct,"","%")].filter(Boolean);

  const pp=[seg(r.paid_min_usd,r.paid_max_usd,"$",""),seg(r.paid_min_pct,r.paid_max_pct,"","%")].filter(Boolean);
  if(pp.length) parts.push("under avg paid: "+pp.join(" & "));

// ---- 🔔 Alerts tab: filter which listings trigger your deal alerts (push + text + email all share these rules) ----
// Every enabled rule is OR'd; within a rule every threshold you set must hold. Matching runs server-side in
// alert_candidates() right after each eBay sync, so a rule saved here applies from the next sync (~90 min).
// "Preview" runs the (unsaved) rule against what's live on eBay right now via alert_preview().
const AL_GAMES=[["pokemon","Pokémon"],["baseball","Baseball"],["basketball","Basketball"],["football","Football"],["hockey","Hockey"],["soccer","Soccer"],["one-piece","One Piece"]];
const AL_GROUPS=[
  ["Market raw price","What the card's raw comp is worth",[["raw_price_min_usd","Min $"],["raw_price_max_usd","Max $"]]],
  ["Listing price","Landed: price + shipping",[["landed_min_usd","Min $"],["landed_max_usd","Max $"]]],
  ["Under market raw","How far below the raw comp",[["raw_min_pct","Min % off"],["raw_max_pct","Max % off"],["raw_min_usd","Min $ off"],["raw_max_usd","Max $ off"]]],
  ["Under your avg paid","Needs a past purchase of the card",[["paid_min_pct","Min % off"],["paid_max_pct","Max % off"],["paid_min_usd","Min $ off"],["paid_max_usd","Max $ off"]]],
  ["Grading upside","Same est. profit / ROI as the Deal Feed",[["min_profit_usd","Min est. profit $"],["min_roi_pct","Min ROI %"]]],
  ["Seller","",[["min_seller_feedback","Min feedback score"]]],
];
const AL_NUMKEYS=AL_GROUPS.flatMap(g=>g[2].map(f=>f[0]));
function alSummary(r){
  const rng=(a,b,pre,suf)=>a!=null&&b!=null?`${pre}${a}–${b}${suf}`:a!=null?`≥${pre}${a}${suf}`:b!=null?`≤${pre}${b}${suf}`:null;
  const p=[];
  const add=(lbl,v)=>{ if(v) p.push(lbl+" "+v); };
  add("market raw",rng(r.raw_price_min_usd,r.raw_price_max_usd,"$",""));
  add("price",rng(r.landed_min_usd,r.landed_max_usd,"$",""));
  add("% off raw",rng(r.raw_min_pct,r.raw_max_pct,"","%"));
  add("$ off raw",rng(r.raw_min_usd,r.raw_max_usd,"$",""));
  add("% under paid",rng(r.paid_min_pct,r.paid_max_pct,"","%"));
  add("$ under paid",rng(r.paid_min_usd,r.paid_max_usd,"$",""));
  if(r.min_profit_usd!=null) p.push("profit ≥$"+r.min_profit_usd);
  if(r.min_roi_pct!=null) p.push("ROI ≥"+r.min_roi_pct+"%");
  if(r.min_seller_feedback!=null) p.push("seller ≥"+r.min_seller_feedback);
  const bt=r.buy_type||"bin"; p.push(bt==="auc"?"auctions":bt==="both"?"BIN+auctions":"BIN only");
  const ex=r.exclude_games||[]; const inc=AL_GAMES.filter(g=>!ex.includes(g[0])).map(g=>g[1]);
  p.push(inc.length===AL_GAMES.length?"all games":inc.length?inc.join("/"):"no games");
  p.push((!r.card_keys||!r.card_keys.length)?"all favorites":r.card_keys.length+" card"+(r.card_keys.length>1?"s":""));
  return p.join(" · ");
}

async function openRadar(){

  if(!sb||!SESSION){ w.innerHTML='<div class="card"><p class="note">Sign in to see your Radar.</p></div>'; return; }

const RADAR_HEAT=new Set(["crossed","surge"]), RADAR_COOL=new Set(["fell","drop"]);
function radarGroups(){
  // newest event per card within this tab (a card can go 'crossed' then later 'surge'), then group by player
  const kind=RADAR.tab==="cool"?RADAR_COOL:RADAR_HEAT;
  const seen=new Map();
  for(const ev of RADAR.events){ if(!kind.has(ev.event_type)) continue; const k=[ev.game,ev.set_name,ev.card_number,ev.parallel].join("¦"); if(!seen.has(k)) seen.set(k,ev); }
  const mv=ev=>(+ev.ref_psa10>0)?(+ev.psa10/+ev.ref_psa10-1):0;
  const g={};
  for(const ev of seen.values()){ const k=ev.game+"¦"+ev.name; (g[k]||(g[k]={name:ev.name,game:ev.game,evs:[]})).evs.push(ev); }
  const list=Object.values(g).map(x=>({...x, n:x.evs.length, avgMove:x.evs.reduce((a,e)=>a+mv(e),0)/x.evs.length, bestRoi:Math.max(...x.evs.map(e=>+e.roi||0)), totProfit:x.evs.reduce((a,e)=>a+(+e.profit||0),0), newest:x.evs[0].created_at}));

  const by={cards:(a,b)=>b.n-a.n||(coolTab?a.avgMove-b.avgMove:b.avgMove-a.avgMove), move:(a,b)=>coolTab?a.avgMove-b.avgMove:b.avgMove-a.avgMove, roi:(a,b)=>b.bestRoi-a.bestRoi, recent:(a,b)=>new Date(b.newest)-new Date(a.newest)}[RADAR.sort]||((a,b)=>b.n-a.n);

// favorites-listings-sync writes one match_audit row per favorite on every run (what eBay returned, how many titles were accepted, and WHY the rest
// were rejected) plus one sync_runs row per run. Two things this is built to expose: (1) "near misses" -- titles with the right player that were
// rejected by exactly one soft check (set name / manufacturer / card number), which is how SP Authentic, O-Pee-Chee and "#NC-SO" cards went missing;
// (2) favorites where eBay clearly has listings but none were accepted. Plus an unfiltered stream of everything that's come in.
let AUD={tab:"flags", rows:[], runs:[], inc:[], q:"", grade:"all", game:"", lateOnly:false, open:new Set(), showAck:false, ack:(()=>{ try{ return JSON.parse(localStorage.getItem("voltdash.auditAck")||"{}"); }catch(e){ return {}; } })()};
const audKey=r=>[r.game,r.set_name,r.card_number,r.parallel].join("¦");
// The sync stores any title rejected by exactly one soft check; most of those are legitimately other cards (Series 1 vs card #1, another
// Pokemon with a similar number). Keep only the ones that are plausibly THIS card: not Pokemon/One Piece, no tiny numeric card numbers, set
// rejections must still share at least half the set words, number rejections must contain every letter/digit run of the number.
const AUD_SET_STOP=new Set(["baseball","basketball","football","hockey","soccer","cards","the","and","of","die","cut"]);
function audNear(r){
  const g=String(r.game||"").toLowerCase();
  if(g==="pokemon"||g==="one-piece") return [];
  const cn=String(r.card_number||"").trim();
  const setToks=(r.set_name||"").toLowerCase().replace(/(19|20)\d{2}/g," ").split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!AUD_SET_STOP.has(w));
  const runs=(cn.toLowerCase().match(/[a-z]+|\d+/g)||[]);
  return (r.near_misses||[]).filter(n=>{
    const t=" "+String(n.title||"").toLowerCase().replace(/[^a-z0-9]+/g," ")+" ";
    if(n.reason==="number"){
      if(/^\d{1,2}$/.test(cn)) return false;
      return runs.length>0 && runs.every(x=>t.includes(x));
    }
    if(n.reason==="set"||n.reason==="manufacturer"){
      if(!setToks.length) return true;
      const have=setToks.filter(w=>t.includes(" "+w+" ")||t.includes(" "+w)).length;
